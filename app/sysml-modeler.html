    if(cur() !== d) return fin();
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    d.shapes.forEach(s => { const a = from.get(s.id), b = geo.get(s.id); if(!a || !b) return; s.x = a.x + (b.x - a.x) * e; s.y = a.y + (b.y - a.y) * e; s.w = a.w + (b.w - a.w) * e; s.h = a.h + (b.h - a.h) * e; });

function alignSel(how){
  const d = cur(); if(!d) return;

  const geo = new Map(d.shapes.map(s => [s.id, {x:s.x, y:s.y, w:s.w, h:s.h}]));
  const mv = (s, nx, ny) => { const a = geo.get(s.id), dx = nx - a.x, dy = ny - a.y; a.x = nx; a.y = ny; d.shapes.forEach(c => { if(c.parent === s.id){ const b = geo.get(c.id); b.x += dx; b.y += dy; } }); };

    case 'right': sel.forEach(s => mv(s, x1 - s.w, s.y)); break;
    case 'hc': sel.forEach(s => mv(s, cx - s.w / 2, s.y)); break;
    case 'top': sel.forEach(s => mv(s, s.x, y0)); break;
    case 'bottom': sel.forEach(s => mv(s, s.x, y1 - s.h)); break;
    case 'vc': sel.forEach(s => mv(s, s.x, cy - s.h / 2)); break;

}

const mctx = document.createElement('canvas').getContext('2d');
let FSC = 1;
function tw(s, bold, size){ mctx.font = (bold ? 'bold ' : '') + ((size || 12) * FSC) + 'px ' + FF; return mctx.measureText(s).width; }
function wrap(s, maxW, bold, size){
  const out = [];
  String(s == null ? '' : s).split('\n').forEach(para => {
    let line = '';
    para.split(/\s+/).filter(Boolean).forEach(w => {
      const cand = line ? line + ' ' + w : w;
      if(tw(cand, bold, size) <= maxW){ line = cand; return; }
      if(line) out.push(line);
      line = '';
      if(tw(w, bold, size) <= maxW){ line = w; return; }
      let chunk = '';
      for(const ch of w){ if(chunk && tw(chunk + ch, bold, size) > maxW){ out.push(chunk); chunk = ''; } chunk += ch; }
      line = chunk;
    });
    out.push(line);
  });
  return out;
}
function T(lines, x, y, o){
  o = o || {}; if(!Array.isArray(lines)) lines = [lines];
  const sz = (o.size || 12) * FSC, lh = o.lh ? o.lh * FSC : Math.round(sz * 1.27);
  let s = `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-family="${FF}" font-size="${sz}" text-anchor="${o.anchor || 'middle'}" fill="${o.fill || '#151515'}"` +

/* ================= EDGE GEOMETRY ================= */
function bx(sh){ const e = E(sh.el), k = e ? e.kind : ''; return {x:sh.x, y:sh.y, w:sh.w, h:sh.h, cx:sh.x + sh.w / 2, cy:sh.y + sh.h / 2, hw:sh.w / 2, hh:sh.h / 2, f:ELL.has(k) ? 'e' : (DIA.has(k) ? 'd' : 'r')}; }
function clipT(b, dx, dy){
  const ax = Math.abs(dx) || 1e-9, ay = Math.abs(dy) || 1e-9;
  if(b.f === 'e') return 1 / Math.sqrt((dx / b.hw) ** 2 + (dy / b.hh) ** 2);
  if(b.f === 'd') return 1 / (ax / b.hw + ay / b.hh);
  return Math.min(b.hw / ax, b.hh / ay);
}
function sideX(b, y, dir){ const dy = y - b.cy; let off = b.hw; if(b.f === 'e') off = b.hw * Math.sqrt(Math.max(0, 1 - (dy / b.hh) ** 2)); else if(b.f === 'd') off = b.hw * Math.max(0, 1 - Math.abs(dy) / b.hh); return b.cx + dir * off; }
function sideY(b, x, dir){ const dx = x - b.cx; let off = b.hh; if(b.f === 'e') off = b.hh * Math.sqrt(Math.max(0, 1 - (dx / b.hw) ** 2)); else if(b.f === 'd') off = b.hh * Math.max(0, 1 - Math.abs(dx) / b.hw); return b.cy + dir * off; }
function straight(A, B){
  const dx = B.cx - A.cx, dy = B.cy - A.cy;
  if(!dx && !dy) return [{x:A.cx, y:A.cy}, {x:B.cx, y:B.cy + 0.01}];
  const ta = clipT(A, dx, dy), tb = clipT(B, -dx, -dy);
  return [{x:A.cx + dx * ta, y:A.cy + dy * ta}, {x:B.cx - dx * tb, y:B.cy - dy * tb}];
}
/* ---- engelden kaçan dik açılı bağlantı yönlendirici ---- */
function segHitsRect(a, b, r, pad){
  const x0 = r.x + pad, x1 = r.x + r.w - pad, y0 = r.y + pad, y1 = r.y + r.h - pad;
  if(x1 <= x0 || y1 <= y0) return false;
  const dx = b.x - a.x, dy = b.y - a.y; if(!dx && !dy) return false;
  let t0 = 0, t1 = 1;
  const P = [-dx, dx, -dy, dy], Q = [a.x - x0, x1 - a.x, a.y - y0, y1 - a.y];
  for(let i = 0; i < 4; i++){
    if(P[i] === 0){ if(Q[i] < 0) return false; }
    else { const t = Q[i] / P[i]; if(P[i] < 0){ if(t > t1) return false; if(t > t0) t0 = t; } else { if(t < t0) return false; if(t < t1) t1 = t; } }
  }
  return t1 - t0 > 1e-6;
}
function routeCtx(d, SM){
  const shapes = d.shapes.filter(s => { const e = E(s.el); return e && !s.parent && !['Partition','Subject','Lifeline'].includes(e.kind) && !(CONT.has(e.kind) && e.kind !== 'Package') && !isComposite(e); });

  const minX = Math.min(...tops.map(s => s.x)), minY = Math.min(...tops.map(s => s.y));
  let ox, oy;
  if(ST.mouse && !forceCopy && C.from !== d.id){ ox = snapv(ST.mouse.x) - minX; oy = snapv(ST.mouse.y) - minY; }
  else { ox = 30; oy = 30; }
  snap();
  const emap = new Map(), smap = new Map(), skipped = [];
  if(copy){
    tops.forEach(s => {
      const e = E(s.el); if(!e) return;
      if(!canDrop(d, e)){ skipped.push(e); return; }
      const owner = e.kind === 'Requirement' ? e.owner : (E(e.owner) ? e.owner : ownerFor(e.kind, d));
      const m1 = new Map(); cloneSubtree(e.id, owner, m1); m1.forEach((v, k) => emap.set(k, v));
    });
  }
  C.shapes.forEach(s => {
    const parentNew = s.parent ? smap.get(s.parent) : null;
    if(s.parent && !parentNew) return;
    let el = s.el;
    if(copy) el = emap.get(s.el) || (s.parent ? s.el : null);
    if(!el || !E(el)) return;
    if(!s.parent && !canDrop(d, E(el))) return;
    const n = Object.assign(JSON.parse(JSON.stringify(s)), {id:uid(), el, x:s.x + ox, y:s.y + oy});
    if(parentNew) n.parent = parentNew; else delete n.parent;
    d.shapes.push(n); smap.set(s.id, n.id);
  });
  C.edges.forEach(ed => {
    const S = smap.get(ed.s), T0 = smap.get(ed.t); if(!S || !T0) return;
    let el = ed.el;
    if(el && copy){
      const r = E(el); if(!r) return;
      const src = emap.get(r.src) || r.src, tgt = emap.get(r.tgt) || r.tgt;
      if(src === r.src && tgt === r.tgt) return;
      const nr = Object.assign(JSON.parse(JSON.stringify(r)), {id:uid(), src, tgt});
      if(nr.sp) nr.sp = emap.get(nr.sp) || nr.sp; if(nr.tp) nr.tp = emap.get(nr.tp) || nr.tp;
      if(nr.part){ delete nr.part; }
      M.els[nr.id] = nr; bump(); el = nr.id;
    }
    if(el && d.edges.some(x => x.el === el)) return;
    const ne = {id:uid(), el:el || null, kind:ed.kind, s:S, t:T0, route:ed.route, stroke:ed.stroke}; if(ed.wp) ne.wp = ed.wp.map(q => ({x:q.x + ox, y:q.y + oy})); if(ed.lo) ne.lo = Object.assign({}, ed.lo);
    d.edges.push(ne);
  });
  d.shapes.filter(s => [...smap.values()].includes(s.id)).forEach(s => autoEdges(d, s));
  ST.sel = new Set([...smap.values()].filter(id => { const s = shapeOf(d, id); return s && !s.parent; }));
  afterChange();
  toast((copy ? 'Yeni eleman olarak yapıştırıldı' : 'Mevcut elemanlar bu diyagramda gösterildi') + (skipped.length ? ` · ${skipped.length} eleman bu diyagram türüne uygun değil` : ''));
}

    }).filter(Boolean).sort((a, b) => a.score - b.score || nm(a.e).localeCompare(nm(b.e), 'tr')).slice(0, 150);
    $('#sres').innerHTML = res.map((r, i) => `<div class="pli" data-sr="${i}">${icon(r.e)} <b>${esc(nm(r.e))}</b> <span class="muted">${esc(KIND[r.e.kind].tr)} · ${esc(pathOf(r.e.owner))}</span><em>${esc(r.snip)}</em></div>`).join('') || '<div class="muted" style="padding:8px">Sonuç yok</div>';
  };
  const go = r => {
    $('#modal').style.display = 'none'; box.style.width = ''; box.style.maxWidth = ''; box.onclick = null;

    const dd = here ? d0 : diagramsShowing(e.id)[0];
    if(e.kind === 'Diagram') openD(e.id);
    else if(dd){ openD(dd.id); const d = cur(); ST.sel = new Set(d.shapes.filter(s => s.el === e.id).map(s => s.id)); const sh = d.shapes.find(s => s.el === e.id); if(sh){ const rr = svgEl.getBoundingClientRect(); d.vx = rr.width / 2 - (sh.x + sh.w / 2) * d.z; d.vy = rr.height / 2 - (sh.y + sh.h / 2) * d.z; } renderAll(); }
    else if(e.kind === 'Requirement'){ openD('@reqtable'); ST.tsel = e.id; renderAll(); }
    renderProps();
  };
  q.oninput = draw;
  q.onkeydown = ev => { ev.stopPropagation(); if(ev.key === 'Escape'){ $('#modal').style.display = 'none'; box.onclick = null; } if(ev.key === 'Enter' && res[0]) go(res[0]); };

}

/* ---- ağaçta çoklu seçim ve toplu sürükleme ---- */
function dropMany(ids, p, target){
  const d = cur(); if(!d) return;
  const ok = ids.map(E).filter(e => e && canDrop(d, e) && !d.shapes.some(s => s.el === e.id && !s.parent));
  if(!ok.length) return toast('Seçili elemanlar bu diyagrama eklenemiyor veya zaten var');
  snap(); ST.batch = true;
  const added = [];
  try {
    const cols = Math.ceil(Math.sqrt(ok.length));
    ok.forEach((e, i) => { dropExisting(e.id, {x:p.x + (i % cols) * 230, y:p.y + Math.floor(i / cols) * 150}, null); ST.sel.forEach(x => added.push(x)); });
  } finally { ST.batch = false; }
  ST.sel = new Set(added); afterChange();
  toast(ok.length + ' eleman eklendi; aralarındaki ilişkiler otomatik çizildi');
}

/* ---- bağlantı ucunu yeniden bağlama ---- */
function reconnectEdge(d, ed, end, tsh){
  const keepSh = shapeOf(d, end === 's' ? ed.t : ed.s);
  const S = end === 's' ? tsh : keepSh, T0 = end === 's' ? keepSh : tsh;
  if(!S || !T0 || (end === 's' ? ed.s : ed.t) === tsh.id) return;
  const kind = edgeKind(ed), a = E(S.el), b = E(T0.el);
  const err = validate(kind, a, b, d); if(err) return toast(err);
  snap();
  ed[end] = tsh.id; delete ed.mx; delete ed.my; delete ed.wp;
  if(ed.el){
    const r = E(ed.el);
    if(end === 's') r.src = a.id; else r.tgt = b.id;
    if(kind === 'Connector' || kind === 'Binding'){ const ps = S.parent && shapeOf(d, S.parent), pt = T0.parent && shapeOf(d, T0.parent); r.sp = ps ? ps.el : null; r.tp = pt ? pt.el : null; }
    if(r.part && E(r.part)){ const p = E(r.part); if(end === 't'){ p.type = b.id; } else { p.owner = a.id; } }
    Object.values(M.els).forEach(dd => {
      if(dd.kind !== 'Diagram' || dd === d) return;
      const before = dd.edges.length;
      dd.edges = dd.edges.filter(x => x.el !== r.id);
      if(dd.edges.length !== before || dd.shapes.some(s => s.el === r.src || s.el === r.tgt)) dd.shapes.filter(s => s.el === r.src || s.el === r.tgt).forEach(s => autoEdges(dd, s));
    });
  }
  afterChange(); toast('Bağlantı yeniden bağlandı');
}

/* ================= INLINE EDIT ================= */
const inl = $('#inl');
let inlDone = null;
function inlineEdit(sx, sy, w, h, val, multi, cb){
  const d = cur();
  inl.style.left = (d.vx + sx * d.z) + 'px'; inl.style.top = (d.vy + sy * d.z) + 'px';
  inl.style.width = Math.max(120, w * d.z) + 'px'; inl.style.height = Math.max(26, h * d.z) + 'px';
  inl.style.textAlign = multi ? 'left' : 'center';
  inl.value = val || ''; inl.style.display = 'block'; inl.focus(); inl.select();
  let done = false;
  inlDone = ok => { if(done) return; done = true; inl.style.display = 'none'; inlDone = null; if(ok && inl.value !== (val || '')) cb(inl.value); };
  inl.onkeydown = ev => {
    ev.stopPropagation();
    if(ev.key === 'Escape') inlDone(false);
    if(ev.key === 'Enter' && (!multi || ev.ctrlKey)){ ev.preventDefault(); inlDone(true); }
  };
  inl.onblur = () => inlDone && inlDone(true);
}
function editShape(sh){
  const e = E(sh.el); if(!e) return;
  const multi = e.kind === 'Comment';
  let y = sh.y, h = sh.h;
  if(e.kind === 'Actor'){ y = sh.y + sh.h - 22; h = 26; }
  else if(BORDER.has(e.kind) || DIA.has(e.kind) || e.kind === 'AcceptTime'){ y = e.kind === 'AcceptTime' ? sh.y + sh.h + 2 : sh.y - 28; h = 26; }
  else if(e.kind === 'Lifeline'){ h = 40; }
  else if(['Block','Subject','Partition','Package','Requirement','ConstraintBlock','State','TestCase','ConstraintProp'].includes(e.kind)){ y = sh.y + 18; h = 28; }
  else if(!multi) { y = sh.y + sh.h / 2 - 15; h = 30; }
  const x = BORDER.has(e.kind) || DIA.has(e.kind) || e.kind === 'AcceptTime' ? sh.x - 50 : (e.kind === 'Actor' ? sh.x - 30 : sh.x);
  const w = BORDER.has(e.kind) || DIA.has(e.kind) || e.kind === 'AcceptTime' ? 140 : (e.kind === 'Actor' ? sh.w + 60 : sh.w);

}
function editEdge(ed, field){
  const r = E(ed.el); if(!r) return;
  if(!ed._pts) renderDiagram();
  if(!ed._pts) return;
  const p = ed._pts, a = p.length === 4 ? p[1] : p[0], b = p.length === 4 ? p[2] : p[1];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;

  if(NRI_REV !== REV || NRI_M !== M){ NRI = new Map(); NRI_REV = REV; NRI_M = M; }
  if(!NRI.has(pre)){
    let max = 0;
    Object.values(M.els).forEach(e => { if(e.kind === 'Requirement' && e.reqId && String(e.reqId).startsWith(pre)){ const n = parseInt(String(e.reqId).slice(pre.length), 10); if(n > max) max = n; } });
    NRI.set(pre, max);
  }
  return pre + String(NRI.get(pre) + 1).padStart(c.digits || 3, '0');
}

}

function covStatus(r, t){

    covered = t.children.length > 0 || sat;
    if(!covered) gaps.push('Ne alt sistem gereksinimi ne model elemanı/fonksiyon tarafından karşılanıyor');
  } else {
    covered = sat;
    if(!t.parents.length) gaps.push('Üst (sistem) gereksinimi yok — yetim');
    if(!sat) gaps.push('Karşılayan model elemanı/fonksiyon yok');
  }
  if(!(r.verif && String(r.verif).trim())) gaps.push('Doğrulama yöntemi tanımsız');

function wordDiff(a, b){
  const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/);
  if(A.length * B.length > 250000) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const n = A.length, m = B.length, L = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = '';
  while(i < n && j < m){
    if(A[i] === B[j]){ out += esc(A[i]); i++; j++; }
    else if(L[i + 1][j] >= L[i][j + 1]){ out += `<del>${esc(A[i])}</del>`; i++; }
    else { out += `<ins>${esc(B[j])}</ins>`; j++; }
  }
  while(i < n){ out += `<del>${esc(A[i++])}</del>`; }
  while(j < m){ out += `<ins>${esc(B[j++])}</ins>`; }
  return out.replace(/<\/del><del>/g, '').replace(/<\/ins><ins>/g, '');
}

/* ---- test kampanyası ---- */
let CP = {grp:'tLevel', res:'all', q:'', scale:'auto'};
function campaignTests(){

}
function ganttSVG(tests){
  const dated = tests.filter(t => t.pStart && !isNaN(Date.parse(t.pStart)));
  if(!dated.length) return `<div class="untr" style="margin-bottom:12px">Zaman çizelgesi için testlere <b>planlanan başlangıç</b> ve <b>bitiş</b> tarihi girin (aşağıdaki tablodan veya Özellikler panelinden).</div>`;
  const DAY = 864e5, P = s => Date.parse(s + 'T00:00:00Z'), today = P(todayISO());
  let min = Infinity, max = -Infinity;
  dated.forEach(t => { const a = P(t.pStart), b = t.pEnd && !isNaN(P(t.pEnd)) ? Math.max(a, P(t.pEnd)) : a; min = Math.min(min, a); max = Math.max(max, b); if(t.rDate && !isNaN(P(t.rDate))){ min = Math.min(min, P(t.rDate)); max = Math.max(max, P(t.rDate)); } });
  if(today >= min - 45 * DAY && today <= max + 45 * DAY){ min = Math.min(min, today); max = Math.max(max, today); }
  min -= 3 * DAY; max += 4 * DAY;
  const days = Math.round((max - min) / DAY);
  const pxd = CP.scale === 'gun' ? 26 : CP.scale === 'hafta' ? 9 : CP.scale === 'ay' ? 3 : Math.max(3, Math.min(26, 980 / days));
  const LW = 270, RH = 26, HH = 42, W = LW + days * pxd + 10;
  const groups = []; const gk = t => CP.grp === 'none' ? '' : CP.grp === 'result' ? testResult(t) : (t[CP.grp] || '(belirtilmemiş)');
  const order = CP.grp === 'tLevel' ? TEST_LEVELS : CP.grp === 'result' ? TEST_RESULT : [];
  dated.forEach(t => { const k = gk(t); let g = groups.find(x => x.k === k); if(!g) groups.push(g = {k, items:[]}); g.items.push(t); });
  groups.sort((a, b) => { const ia = order.indexOf(a.k), ib = order.indexOf(b.k); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.k.localeCompare(b.k, 'tr'); });
  const nRows = dated.length + (CP.grp === 'none' ? 0 : groups.length), H = HH + nRows * RH + 6;
  const X = ms => LW + (ms - min) / DAY * pxd;
  let s = `<svg class="gantt" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/><rect x="0" y="0" width="${W}" height="${HH}" fill="#26364b"/>`;
  const AYLAR = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  for(let d = 0; d <= days; d++){
    const ms = min + d * DAY, dt = new Date(ms), x = X(ms), dom = dt.getUTCDate(), wd = dt.getUTCDay();
    if(pxd >= 9 && (wd === 0 || wd === 6)) s += `<rect x="${x}" y="${HH}" width="${pxd}" height="${H - HH}" fill="#f5f6f8"/>`;
    const dim = new Date(Date.UTC(dt.getUTCFullYear(), dt.getUTCMonth() + 1, 0)).getUTCDate();
    if(dom === 1 || (d === 0 && (dim - dom + 1) * pxd > 70)){ s += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${d === 0 ? 'none' : '#cfd6df'}"/><text x="${x + 4}" y="15" fill="#fff" font-size="11.5" font-weight="600">${AYLAR[dt.getUTCMonth()]} ${dt.getUTCFullYear()}</text>`; }
    if(pxd >= 14) s += `<text x="${x + pxd / 2}" y="34" fill="#c9d3e0" font-size="10" text-anchor="middle">${dom}</text>`;
    else if(wd === 1 && pxd >= 5) s += `<line x1="${x}" y1="${HH}" x2="${x}" y2="${H}" stroke="#eef1f4"/><text x="${x + 2}" y="34" fill="#c9d3e0" font-size="9.5">${dom}</text>`;
  }
  s += `<text x="10" y="30" fill="#fff" font-size="12" font-weight="600">Test durumu</text>`;
  let y = HH;
  groups.forEach(g => {
    if(CP.grp !== 'none'){ s += `<rect x="0" y="${y}" width="${W}" height="${RH}" fill="#eef2f8"/><text x="10" y="${y + 17}" font-size="12" font-weight="700" fill="#26364b">${esc(g.k)} <tspan fill="#8592a3" font-weight="400">(${g.items.length})</tspan></text>`; y += RH; }
    g.items.forEach(t => {
      const a = P(t.pStart), b = t.pEnd && !isNaN(P(t.pEnd)) ? Math.max(a, P(t.pEnd)) : a, res = testResult(t), col = RES_COL[res], late = overdue(t);
      const bx = X(a), bw = Math.max(pxd, (b - a) / DAY * pxd + pxd), lbl = nm(t) + (t.procNo ? ' · ' + t.procNo : '');
      s += `<g data-goto="${t.id}" style="cursor:pointer"><rect x="0" y="${y}" width="${W}" height="${RH}" fill="${ST.tsel === t.id ? '#e8f0fe' : 'transparent'}"/><line x1="0" y1="${y + RH}" x2="${W}" y2="${y + RH}" stroke="#eef1f4"/>`;
      s += `<text x="${CP.grp === 'none' ? 10 : 20}" y="${y + 17}" font-size="12" fill="#26364b">${esc(lbl.length > 38 ? lbl.slice(0, 37) + '…' : lbl)}<title>${esc(lbl)}</title></text>`;
      s += `<rect x="${bx}" y="${y + 5}" width="${bw}" height="${RH - 10}" rx="4" fill="${col}" ${late ? 'stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4 2"' : ''}><title>${esc(nm(t))}\n${fmtD(t.pStart)} – ${fmtD(t.pEnd || t.pStart)}\nSonuç: ${res}${late ? ' (gecikmiş)' : ''}</title></rect>`;
      const rt = res + (late ? ' !' : '');
      if(bw > tw(rt, true, 10.5) + 10) s += `<text x="${bx + bw / 2}" y="${y + 17}" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle" pointer-events="none">${esc(rt)}</text>`;
      else s += `<text x="${bx + bw + 4}" y="${y + 17}" font-size="10.5" fill="${col}" font-weight="700" pointer-events="none">${esc(rt)}</text>`;
      if(t.rDate && !isNaN(P(t.rDate))){ const rx = X(P(t.rDate)) + pxd / 2; s += `<path d="M${rx} ${y + 3}l5 5-5 5-5-5z" fill="#26364b" stroke="#fff"><title>Sonuç tarihi ${fmtD(t.rDate)}</title></path>`; }
      s += `</g>`; y += RH;
    });
  });
  if(today >= min && today <= max){ const tx = X(today) + pxd / 2; s += `<line x1="${tx}" y1="${HH - 6}" x2="${tx}" y2="${H}" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/><rect x="${tx - 22}" y="${HH - 12}" width="44" height="13" rx="6" fill="#c0392b"/><text x="${tx}" y="${HH - 2}" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="700">Bugün</text>`; }

}

  ST.exp.add(target); sel.forEach(id => { const n = map.get(id); if(n) ST.exp.add(n); });
  afterChange();

}

const FMT_VER = 2;
function migrateModel(m){
  const notes = [], els = m.els, has = id => !!(id && els[id]);
  let n;
  const from = +m.v || 1;
  if(from > FMT_VER) notes.push(`Dosya daha yeni bir sürümle (${m.app || 'v' + from}) kaydedilmiş; bu sürümün tanımadığı alanlar korunur ama kullanılamayabilir`);
  /* bilinmeyen tür, kimlik uyuşmazlığı */
  n = 0; let u = 0; for(const k in els){ const e = els[k]; if(!e || typeof e !== 'object'){ delete els[k]; n++; continue; } if(e.id !== k) e.id = k; if(!KIND[e.kind]){ e._unk = e._unk || e.kind; e.kind = 'Comment'; e.name = e.name || ''; e.doc = `[Tanınmayan eleman türü: ${e._unk}] ` + (e.doc || ''); u++; } }
  if(n) notes.push(n + ' geçersiz kayıt atıldı');
  if(u) notes.push(u + ' tanınmayan türdeki eleman not olarak korundu');
  /* sahipsiz elemanlar kök modele */
  n = 0; for(const k in els){ const e = els[k]; if(k === m.rootId) continue; if(!has(e.owner) || e.owner === k){ e.owner = m.rootId; n++; } }
  /* sahiplik döngüsü */
  for(const k in els){ const seen = new Set([k]); let o = els[k].owner; while(o && els[o]){ if(seen.has(o)){ els[k].owner = m.rootId; n++; break; } seen.add(o); o = els[o].owner; } }
  if(n) notes.push(n + ' sahipsiz eleman köke taşındı');
  /* ucu kopuk ilişkiler */
  n = 0; for(const k in els){ const e = els[k]; if(KIND[e.kind] && KIND[e.kind].rel && (!has(e.src) || !has(e.tgt))){ delete els[k]; n++; } }
  if(n) notes.push(n + ' ucu olmayan ilişki silindi');
  /* diyagram tutarlılığı */
  let ns = 0, ne = 0;
  for(const k in els){ const d = els[k]; if(d.kind !== 'Diagram') continue;
    d.shapes = Array.isArray(d.shapes) ? d.shapes : []; d.edges = Array.isArray(d.edges) ? d.edges : [];
    const b0 = d.shapes.length; d.shapes = d.shapes.filter(sh => sh && sh.id && has(sh.el) && isFinite(sh.x) && isFinite(sh.y)); ns += b0 - d.shapes.length;
    const ids = new Set(d.shapes.map(sh => sh.id)); d.shapes.forEach(sh => { if(sh.parent && !ids.has(sh.parent)) delete sh.parent; if(!(sh.w > 0)) sh.w = 120; if(!(sh.h > 0)) sh.h = 60; });
    const e0 = d.edges.length; d.edges = d.edges.filter(ed => ed && ids.has(ed.s) && ids.has(ed.t) && (!ed.el || has(ed.el))); ne += e0 - d.edges.length;
  }
  if(ns || ne) notes.push(`diyagramlardan ${ns} geçersiz şekil, ${ne} geçersiz bağlantı kaldırıldı`);
  /* gereksinim alanları (v1 dosyaları) */
  for(const k in els){ const e = els[k]; if(e.kind === 'Requirement'){ if(!e.level) e.level = 'Sistem'; if(!e.status) e.status = 'Taslak'; if(e.text == null) e.text = ''; if(!e.attrs || typeof e.attrs !== 'object') e.attrs = {}; } }
  if(from < FMT_VER) m.v = FMT_VER;
  return notes;
}

document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = ev.key, c = ev.ctrlKey || ev.metaKey;
  if(k === ' '){ ST.space = true; ev.preventDefault(); return; }
  if(ev.altKey && k === 'ArrowLeft'){ ev.preventDefault(); navBack(); return; }
  if(ev.altKey && k === 'ArrowRight'){ ev.preventDefault(); navFwd(); return; }
  if(c && (k === 'z' || k === 'Z') && !ev.shiftKey){ ev.preventDefault(); undo(); return; }
  if(c && (k === 'y' || k === 'Y' || ((k === 'z' || k === 'Z') && ev.shiftKey))){ ev.preventDefault(); redo(); return; }
  if(c && (k === 's' || k === 'S')){ ev.preventDefault(); saveJSON(ev.shiftKey); return; }
  if(c && ev.shiftKey && (k === 'l' || k === 'L')){ ev.preventDefault(); const d0 = cur(); if(d0) runLayout(LAYOUTS[d0.dtype][0][0]); return; }
  if(c && (k === 'o' || k === 'O')){ ev.preventDefault(); openFile(); return; }
  if(k === 'Escape' && ST.painter){ fmtPainter(true); return; }
  if(k === 'Escape'){ if($('#modal').style.display === 'flex'){ $('#modal').style.display = 'none'; return; } setTool(null); ST.sel.clear(); hideMenu(); renderDiagram(); renderProps(); return; }
  const d = cur();
  if(c && (k === 'f' || k === 'F')){ ev.preventDefault(); searchModel(); return; }
  if(ST.focus === 'tree'){
    if(k === 'Delete' && ST.tsel && ST.tsel !== M.rootId){ const ids = ST.tmulti.size > 1 ? [...ST.tmulti].filter(x => x !== M.rootId) : [ST.tsel]; if(ids.length > 1 && !confirm(ids.length + ' eleman modelden silinsin mi?')) return; snap(); delModel(ids); ST.tmulti = new Set(); afterChange(); }
    if(k === 'F2' && ST.tsel){ ev.preventDefault(); treeRename(ST.tsel); }
    if(k === 'Enter' && ST.tsel && E(ST.tsel) && E(ST.tsel).kind === 'Diagram') openD(ST.tsel);
    return;
  }
  if(!d) return;
  if(c && (k === 'a' || k === 'A')){ ev.preventDefault(); ST.sel = new Set(d.shapes.map(s => s.id)); renderDiagram(); renderProps(); return; }
  if(c && (k === 'c' || k === 'C')){ if(copySel()) ev.preventDefault(); return; }
  if(c && (k === 'v' || k === 'V')){ ev.preventDefault(); pasteClip(ev.shiftKey); return; }
  if(c && (k === 'd' || k === 'D')){ ev.preventDefault(); duplicateSel(); return; }
  if(k === 'Delete'){
    if(!ST.sel.size) return; ev.preventDefault();
    if(ev.shiftKey){ snap(); removeFromDiagram(d, [...ST.sel]); afterChange(); } else delSelectedModel();
    return;
  }
  if(k === 'F2'){ ev.preventDefault(); const id = [...ST.sel][0]; const sh = id && shapeOf(d, id); if(sh) editShape(sh); else { const ed = d.edges.find(x => x.id === id); if(ed) editEdge(ed, 'name'); } return; }
  if(k.startsWith('Arrow') && ST.sel.size){
    ev.preventDefault();
    const st = ev.shiftKey ? 1 : G, dx = k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, dy = k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0;
    snap();
    const set = new Set([...ST.sel]); d.shapes.forEach(s => { if(s.parent && set.has(s.parent)) set.add(s.id); });
    d.shapes.forEach(s => { if(set.has(s.id) && !(s.parent && !ST.sel.has(s.parent) && ST.sel.has(s.id))){ s.x += dx; s.y += dy; } });
    renderDiagram(); persistSoon(); return;
  }
  if(k === '+' || k === '='){ zoomBtn(1.2); } if(k === '-'){ zoomBtn(1 / 1.2); }
});

  <tr><td>Fragment</td><td>Sıralama diyagramında alt/opt/loop/par/break/ref… Operand koşulları Özellikler'de her satıra bir tane; ayırıcılar mavi tutamakla taşınır. Fragment taşınınca içindeki mesajlar da taşınır. Yürütme çubukları otomatik çizilir.</td></tr>

  <tr><td>Stereotip</td><td>Elemanın Özellikler panelinde <b>Stereotipler → + Yeni</b> veya listeden uygula. Stereotipin etiketleri (<i>ad : tip = varsayılan</i>) ve dolgu rengi tanımlanır; değerler elemanda doldurulur ve blokta <i>tags</i> bölmesinde görünür.</td></tr>
  </table>
  <h3>Analiz ▾</h3>
  <table>
  <tr><td>Parametrik hesap</td><td>Kısıt bloklarının denklemleri (ör. <i>P = V * I</i>; birden fazlası <i>;</i> ile) binding connector'larla bağlı value'lar üzerinden çözülür. Varsayılan değeri dolu value'lar girdi, boşlar çıktıdır; sonuç <i>= 98 ⚙</i> olarak gösterilir. Tek bilinmeyenli denklemler sayısal yöntemle de çözülür.</td></tr>
  <tr><td>Bütçe analizi</td><td>Kütle, güç, maliyet gibi bir value property'yi composition ağacı boyunca çoklukları da hesaba katarak toplar; sınır ve tasarım payıyla kalan marjı gösterir, sonucu modele yazar, Excel'e aktarır.</td></tr>
  <tr><td>Simülasyon</td><td>Aktivite diyagramında token akışı (fork/join, karar dalı seçimi), durum makinesinde aktif durumlar, olay düğmeleri, entry/exit/do günlüğü, bileşik durum ve geçmiş. Adım adım veya otomatik.</td></tr>
  <tr><td>Tahsis matrisi</td><td>Aktivite/aksiyon × blok/part; hücreye tıklayınca «allocate» kurulur. Kulvardan gelen dolaylı tahsis ○ ile gösterilir.</td></tr>
  <tr><td>Genel tablo</td><td>Seçilen türdeki elemanların düzenlenebilir tablosu (stereotip etiketleri sütun olarak); Excel'e aktarılır.</td></tr>
  <tr><td>İlişki haritası</td><td>Seçili elemanın ilişkilerini katmanlı harita olarak gösterir; çift tık merkeze alır.</td></tr>
  <tr><td>N² matrisi</td><td>Bağlam bloğunun part'ları (veya tüm modelde blok tipleri) köşegende; hücrede satırdan sütuna giden arayüzler (ID ve akış öğeleri). Tıklayınca bağlantı seçilir, çift tıklayınca IBD açılır.</td></tr>
  <tr><td>ICD tablosu</td><td>Her connector bir arayüz: kaynak/hedef, yön, arayüz bloğu, akış öğeleri modelden; ID, tür, protokol, konnektör, özellikler tabloda. Uyum sütunu yön çelişkisi, eksik akış özelliği, tip ve birim uyumsuzluğunu gösterir. Excel ve Word ICD çıktısı.</td></tr>
  <tr><td>FMEA / FMECA</td><td>Blok, part ve fonksiyonlar için arıza modları: neden, etkiler, Ş/O/T ve RPN, önlem ve artık RPN, FMECA mod kritikliği (Cm = β·α·λp·t). Önleyici gereksinim bağlanır, doğrulayan testler gösterilir. ⚑ ile riske aktarılır.</td></tr>
  <tr><td>Risk kaydı</td><td>Olasılık × etki (1–5), seviye, strateji, önlem, sorumlu ve tarih; önlem öncesi/sonrası 5×5 matris (hücreye tıklayınca süzer). Excel ve raporda.</td></tr>
  <tr><td>Durum geçiş tablosu</td><td>Durum makinesinin geçişleri liste veya durum × olay matrisi olarak; olay/koşul/etki hücrede düzenlenir; ulaşılamayan, çıkışı olmayan durumlar ve belirsiz geçişler sayılır.</td></tr>
  <tr><td>Test profilleri</td><td>Rastgele titreşim (PSD), sinüs süpürme, şok tepki spektrumu (SRS) ve termal döngü. Kırılma noktalarından Grms, eğim (dB/oktav), yer değiştirme, süre ve tolerans bandı hesaplanır; Excel'den yapıştırılabilir. İki profil karşılaştırılır (marj, kapsama), birden çoğunun zarfı alınır, ± dB ölçeklenir. Test durumlarına bağlanır; VCRM ve raporda görünür. Gereksinim diyagramında kutu içinde grafikle gösterilir.</td></tr>
  </table>
  <h3>XMI ve şablonlar (Araçlar ▾)</h3>
  <table>
  <tr><td>XMI dışa aktar</td><td>UML 2.5 / SysML 1.6 XMI: paket, blok, arayüz, part/port/value/akış, gereksinim (id, metin), ilişkiler, aktivite ve durum makineleri. Cameo: <i>File → Import From → UML 2.x XMI</i>. Diyagram yerleşimi aktarılmaz.</td></tr>
  <tr><td>XMI içe aktar</td><td>Cameo/MagicDraw, Papyrus, EA XMI dosyaları "XMI: …" paketine aktarılır; istenirse BDD, IBD, use case, aktivite, durum makinesi ve gereksinim diyagramları otomatik oluşturulur.</td></tr>
  <tr><td>Şablon ekle</td><td>MIL-STD-810H (14 yöntem) ve SMC-S-016 kalifikasyon gereksinimleri + test durumları + Verify; proje paket iskeleti.</td></tr>
  </table>
  <h3>Gereksinim yönetimi (Gereksinimler ▾)</h3>
  <table>
  <tr><td>Gereksinim tablosu</td><td>Sistem ve alt sistem gereksinimlerini ekleyin (alt sistem eklerken alt sistem adı sorulur; filtrede alt sistemler adlarıyla listelenir), hücreye tıklayıp düzenleyin. Doğrulama yöntemi T/A/M/G (Test, Analiz, Muayene, Gösterim) düğmeleriyle. İzlenebilirlik sütunlarındaki <b>+</b> ile üst gereksinim, alt gereksinim, karşılayan model elemanı, fonksiyon ve test bağlanır.</td></tr>
  <tr><td>Sütunlar / özellikler</td><td>Sütunları gizleyin/gösterin, özel özellik (attribute) ekleyin/silin/yeniden adlandırın, ID öneklerini ayarlayın.</td></tr>
  <tr><td>Şartnameden çıkar</td><td>Word (.docx) / metin şartnameden zorunluluk ifadesiyle biten cümleler; bölüm numarası (Md. 3.2.1), madde başı ister numarası ([TŞ-014]) ve tablo satırları okunur. Önizlemede kalite rozeti ve mevcutlara benzerlik gösterilir; seçilenler Taslak olarak eklenir.</td></tr>
  <tr><td>Dışa aktarma</td><td>Excel, Word (gereksinim spesifikasyonu) ve ReqIF çıktısından önce hangi attribute'ların hangi sırayla aktarılacağını, kapsamı (sistem / alt sistem) ve Excel'deki ek sayfaları seçersiniz. Seçim modelle kaydedilir.</td></tr>
  <tr><td>İzlenebilirlik matrisi</td><td>Satır/sütun kümeleri: sistem, alt sistem, fonksiyonlar, bloklar, model elemanları, testler, use case'ler. Hücreye tıklayınca ilişki kurulur/kaldırılır. Kırmızı başlıklar ilişkisiz satır/sütunlardır.</td></tr>
  <tr><td>Kapsama analizi</td><td>Karşılanmayan sistem gereksinimleri, yetim alt sistem gereksinimleri, doğrulama yöntemi olmayanlar, gereksinime izlenmeyen bloklar/fonksiyonlar; yüzde göstergeleri.</td></tr>
  <tr><td>Excel / ReqIF</td><td>İçe aktarmada sütunlar otomatik eşleşir, isterseniz değiştirin; bilinmeyen sütunlar yeni özellik olur. Üst gereksinim ID'leri Derive ilişkisine dönüşür. ReqIF (.reqif) dosyaları da aynı pencereyle aktarılır. Dışa aktarma: gereksinimler + matrisler + kapsama + kalite + VCRM + test sayfaları; ayrıca ReqIF 1.2 (DOORS, Polarion vb.).</td></tr>
  <tr><td>Durum ve geçmiş</td><td>Taslak → İncelemede → Onaylı → Değişiklikte → İptal. Onaylı gereksinimin metni/yöntemi/seviyesi değişirse otomatik "Değişiklikte" olur. Her değişiklik kim/ne zaman/eski→yeni ve gerekçeyle kaydedilir (Özellikler → Değişiklik geçmişi). Kullanıcı adı: Gereksinimler ▾ → Kullanıcı adım.</td></tr>
  <tr><td>Kalite raporu</td><td>INCOSE kurallarıyla metin denetimi: cümle "-ecek / -acak / -ecektir / -acaktır" ile bitmeli (Yazım kuralı seçiminden "-malıdır / -melidir" de seçilebilir), belirsiz kelimeler, birden fazla ister, birimsiz sayı, TBD, aşırı uzunluk, yinelenen ID, çok benzer gereksinimler.</td></tr>
  <tr><td>Taban çizgileri</td><td>Gereksinim setini adlandırarak dondurun (ör. SRR, PDR); iki taban çizgisini veya taban çizgisini güncel modelle karşılaştırın, farkı Excel'e alın.</td></tr>
  <tr><td>Etki analizi</td><td>Sağ tık veya Özellikler → "Etki analizi": bir eleman değişirse etkilenen gereksinimler, elemanlar, testler ve diyagramlar.</td></tr>
  </table>
  <h3>Doğrulama ve test</h3>
  <table>
  <tr><td>Test durumu</td><td>Prosedür no, yöntem, doğrulama seviyesi, test edilen birim, standart, sorumlu, planlanan tarihler, sonuç (Planlandı / Yapılmadı / Geçti / Kaldı / Koşullu), sonuç tarihi, rapor no. Sonuç diyagramda rozet olarak görünür.</td></tr>
  <tr><td>VCRM</td><td>Gereksinim × T/A/M/G, seviye, test/prosedür, sonuç, rapor no ve hesaplanan doğrulama durumu (Doğrulandı / Kısmen / Kaldı / Planlandı / Faaliyet yok).</td></tr>
  <tr><td>Test kampanyası</td><td>Testlerin düzenlenebilir tablosu ve zaman çizelgesi (Gantt); seviyeye, sonuca, birime göre gruplama; gecikmiş testler kırmızı çerçeveli. Excel'den test sonuçları geri aktarılabilir (prosedür no veya ada göre eşleşir).</td></tr>
  </table>
  <h3>Araçlar ▾</h3>
  <table>
  <tr><td>Model karşılaştır</td><td>Başka bir .sysml dosyasıyla eleman bazında fark (eklenen / silinen / değişen, kelime düzeyinde metin farkı); farkları işaretleyip bu modele uygulama (Ctrl+Z ile geri alınır); Excel'e aktarma.</td></tr>
  <tr><td>İnceleme notları</td><td>Seçili elemanın Özellikler panelinin altından not ekleyin, yanıtlayın, kapatın. Açık notlu elemanlar diyagramda sarı rozetle görünür; Araçlar ▾ → İnceleme notları tüm notları listeler.</td></tr>
  <tr><td>Rapor oluştur</td><td>Seçilen bölümler ve diyagramlarla Word (.docx; içindekiler, sayfa numarası, şekil başlıkları) veya yazdırılabilir HTML rapor.</td></tr>
  <tr><td>Model doğrulama</td><td>Tipsiz part, isimsiz/aynı adlı eleman, kopuk ilişki, başlangıç/bitişi olmayan aktivite, ulaşılamayan durum, aktörsüz use case, döngüsel kompozisyon/kalıtım, port yön uyumsuzluğu, bağlantısız test… Satıra tıklayınca eleman gösterilir.</td></tr>
  <tr><td>Modeli birleştir</td><td>Başka bir .sysml dosyasından seçilen paketleri hedef pakete aktarır. Aynı kimlikli elemanlar güncellenir, atlanır veya kopya olarak eklenir.</td></tr>
  </table>
  <h3>Düzenleme kısayolları</h3>
  <table>
  <tr><td><kbd>Ctrl+C</kbd> / <kbd>Ctrl+V</kbd></td><td>Kopyala / yapıştır. Başka diyagrama yapıştırınca aynı elemanlar gösterilir; aynı diyagramda yeni eleman olarak kopyalanır. <kbd>Ctrl+Shift+V</kbd> her zaman yeni eleman, <kbd>Ctrl+D</kbd> çoğaltır.</td></tr>
  <tr><td><kbd>Ctrl+K</kbd></td><td>Komut paleti: tüm komutlar, menü öğeleri, görünümler, diyagramlar ve elemanlar (ad, ID) tek kutudan; ↑↓ ile seçip Enter.</td></tr>
  <tr><td>EN / TR</td><td>Arayüz dili: menüler, paneller, pencereler ve mesajlar İngilizce / Türkçe. Model içeriği ve çıktılar değişmez.</td></tr>
  <tr><td><kbd>Ctrl+F</kbd></td><td>Model içinde ara (ad, ID, metin, açıklama, özellik değerleri).</td></tr>
  <tr><td>Ağaçta çoklu seçim</td><td><kbd>Ctrl</kbd>/<kbd>Shift</kbd> + tık; seçilenler diyagrama birlikte sürüklenir, aralarındaki ilişkiler çizilir.</td></tr>
  <tr><td>Bağlantı ucu</td><td>Seçili bağlantının uç tutamacını başka elemana sürükleyerek yeniden bağlayın.</td></tr>
  <tr><td>Görünüm</td><td>Özellikler → Görünüm: dolgu ve çizgi rengi, blok bölmelerini gizleme, diyagram yazı boyutu; aktivitede yatay kulvar.</td></tr>
  </table>
  <h3>Otomatik düzen ve hizalama</h3>
  <table>
  <tr><td>Düzen ▾ / <kbd>Ctrl+Shift+L</kbd></td><td>Diyagram türüne özel düzenler: BDD'de hiyerarşik (bütün üstte, parçalar altta; genelleme üst sınıf üstte), ızgara, dairesel. IBD'de bağlantı yönüne göre akış (out → in), portlar karşı tarafa bakacak şekilde yeniden dizilir. Use case'te aktörler solda ya da iki yanda, use case'ler sistem sınırı içinde, include/extend sağa doğru. Aktivitede akış sırası; kulvarlar varsa her düğüm kendi kulvarında kalır.</td></tr>
  <tr><td>Toparla</td><td>Mevcut yerleşimi koruyup çakışmaları giderir ve ızgaraya oturtur.</td></tr>
  <tr><td>Hizala / dağıt</td><td>Birden fazla şekil seçiliyken: sola/sağa/üste/alta hizala, ortala, eşit aralıkla dağıt, aynı boyut. Sağ tık menüsünde de vardır.</td></tr>
  <tr><td>Geri alma</td><td>Her düzen tek adımda <kbd>Ctrl+Z</kbd> ile geri alınır.</td></tr>
  </table>
  <h3>İkonlar</h3>
  <table>
  <tr><td>İkon ata</td><td>Blok, part veya aktör seçip araç çubuğundaki <b>İkon</b> düğmesi, sağ tık → "İkon ata…" veya Özellikler panelinden. 10 kategoride 200'e yakın ikon, aramalı. Birden çok eleman seçiliyse hepsine birden atanır.</td></tr>
  <tr><td>Gösterim</td><td>Blokta "köşede küçük" veya "başlıkta büyük"; renk kategoriden gelir, istenirse değiştirilir. Part'lar ve nesne düğümleri ikonu tip bloğundan otomatik alır; ağaçta da görünür.</td></tr>
  </table>
  <h3>Modelle senkron davranışlar</h3>
  <table>
  <tr><td>BDD Composition / Aggregation</td><td>Bütün blokta hedef blok tipinde otomatik <i>part</i> oluşturur; bloğun "parts" bölmesinde görünür.</td></tr>
  <tr><td>IBD Port</td><td>Part'a bırakılan port, part'ın tip bloğuna eklenir; BDD'de bloğun "ports" bölmesinde görünür.</td></tr>
  <tr><td>IBD oluşturma</td><td>Bloğun mevcut part'ları, portları ve connector'ları otomatik yerleştirilir.</td></tr>
  <tr><td>Ad değişikliği</td><td>Ağaçta, tüm diyagramlarda ve özelliklerde anında güncellenir.</td></tr>
  </table>
  <h3>Kayıt</h3>
  <table>
  <tr><td>Otomatik</td><td>Model tarayıcının yerel deposunda otomatik saklanır (aynı bilgisayar/tarayıcı).</td></tr>
  <tr><td>Kaydet</td><td>.sysml.json dosyası indirir; "Aç" ile geri yüklenir.</td></tr>
  <tr><td>HTML olarak kaydet</td><td>Modeli içine gömülü uygulama dosyası üretir; paylaştığınız kişi açınca modeli hazır görür.</td></tr>
  <tr><td>Dışa aktar ▾</td><td>PNG, SVG, panoya kopyalama; tek diyagram, açık sekmeler veya tüm diyagramlar için çok sayfalı <b>PDF</b> (A4/A3, yön otomatik); yazdırma. Diyagram özelliklerinden SysML çerçevesi gizlenebilir.</td></tr>
  <tr><td>Eski / bozuk dosya</td><td>Önceki sürümlerin dosyaları açılırken otomatik yükseltilir; sahipsiz eleman, ucu kopuk ilişki, geçersiz diyagram şekli gibi tutarsızlıklar onarılır ve bildirilir.</td></tr>
  <tr><td>Büyük modeller</td><td>Gereksinim tablosu ve kapsama analizi 250'şer satır gösterir; alttaki düğmelerle devamı açılır.</td></tr>

/* splitters */
(function(){
  const vs = $('#vsplit'), hs = $('#hsplit'), left = $('#left'), tb = $('#treeBox'), pb = $('#propsBox');
  vs.addEventListener('mousedown', ev => {
    ev.preventDefault(); const sx = ev.clientX, w0 = left.offsetWidth;
    const mv = e => { left.style.width = Math.max(180, Math.min(600, w0 + e.clientX - sx)) + 'px'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
  hs.addEventListener('mousedown', ev => {
    ev.preventDefault(); const sy = ev.clientY, h0 = tb.offsetHeight, tot = tb.offsetHeight + pb.offsetHeight;
    const mv = e => { const h = Math.max(60, Math.min(tot - 60, h0 + e.clientY - sy)); tb.style.flex = 'none'; tb.style.height = h + 'px'; pb.style.flex = '1'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
})();

/* içe aktarılan yapı için otomatik diyagramlar */
function xmiAutoDiagrams(pkgId, opt){
  let n = 0;
  const all = Object.values(M.els).filter(e => e.id === pkgId || isAnc(pkgId, e.id));
  const lay = (d, mode) => { const g = layoutDiagram(d, mode); d.shapes.forEach(s => { const b = g.get(s.id); if(b){ s.x = b.x; s.y = b.y; s.w = b.w; s.h = b.h; } }); delete d._seqMsgs; };
  const pk = all.filter(e => e.kind === 'Package' || e.id === pkgId);
  pk.forEach(p => {
    const bl = kidsOf(p.id).filter(e => ['Block', 'InterfaceBlock', 'ConstraintBlock', 'ValueType', 'Enumeration', 'Signal'].includes(e.kind));
    if(bl.length){ const d = mk('Diagram', p.id, {name:p.name + ' BDD', dtype:'bdd', shapes:[], edges:[], vx:60, vy:70, z:1}); bl.forEach((b, i) => addShape(d, b.id, (i % 4) * 240, Math.floor(i / 4) * 200)); d.shapes.slice().forEach(s => autoEdges(d, s)); lay(d, 'tb'); n++; }
    const uc = kidsOf(p.id).filter(e => ['Actor', 'UseCase'].includes(e.kind));
    if(uc.some(e => e.kind === 'UseCase')){ const d = mk('Diagram', p.id, {name:p.name + ' Use Case', dtype:'uc', shapes:[], edges:[], vx:60, vy:70, z:1}); uc.forEach((b, i) => addShape(d, b.id, (i % 4) * 200, Math.floor(i / 4) * 140)); d.shapes.slice().forEach(s => autoEdges(d, s)); lay(d, 'ucLeft'); n++; }
    const rq = kidsOf(p.id).filter(e => e.kind === 'Requirement');
    if(opt.req && rq.length){ const d = mk('Diagram', p.id, {name:p.name + ' Gereksinimler', dtype:'req', shapes:[], edges:[], vx:60, vy:70, z:1}); const list = rq.concat(rq.flatMap(r => kidsOf(r.id).filter(c => c.kind === 'Requirement'))).slice(0, 40); list.forEach((b, i) => addShape(d, b.id, (i % 4) * 280, Math.floor(i / 4) * 170)); d.shapes.slice().forEach(s => autoEdges(d, s)); lay(d, 'tb'); n++; }
  });
  all.filter(e => e.kind === 'Block' && kidsOf(e.id).some(c => c.kind === 'Part')).forEach(b => { const d = newDiagramCore(b.id, 'ibd', b.name + ' IBD'); lay(d, 'lr'); n++; });
  all.filter(e => e.kind === 'Activity' && kidsOf(e.id).some(c => !KIND[c.kind].rel && c.kind !== 'Partition')).forEach(a => {
    const d = newDiagramCore(a.id, 'act', a.name);
    kidsOf(a.id).filter(c => !KIND[c.kind].rel && !['Partition', 'Pin', 'Diagram'].includes(c.kind)).forEach((c, i) => { const sh = addShape(d, c.id, (i % 3) * 200, Math.floor(i / 3) * 110); if(['Action', 'SendSignal', 'AcceptEvent'].includes(c.kind)) showPorts(d, sh); });
    d.shapes.slice().forEach(s => autoEdges(d, s)); lay(d, 'tb'); n++;
  });
  all.filter(e => e.kind === 'StateMachine').forEach(sm => {
    const d = newDiagramCore(sm.id, 'stm', sm.name);
    const place = (ownerId, x0, y0) => { const ch = kidsOf(ownerId).filter(c => NESTK.has(c.kind)); let i = 0; ch.forEach(c => { const comp = kidsOf(c.id).some(q => NESTK.has(q.kind)); const sh = addShape(d, c.id, x0 + (i % 3) * 220, y0 + Math.floor(i / 3) * 140); i++; if(comp){ sh.w = 420; sh.h = 260; place(c.id, sh.x + 20, sh.y + 60); } }); };
    place(sm.id, 0, 0);
    d.shapes.slice().forEach(s => autoEdges(d, s)); if(!d.shapes.some(s => isComposite(E(s.el)))) lay(d, 'tb'); n++;
  });
  return n;
}

function simStart(){

}

  SIM.fired = new Set(); SIM.step++;

function simAncestors(id){ const a = []; let e = E(id); while(e && e.kind !== 'StateMachine'){ a.push(e.id); e = E(e.owner); } return a; }
function simEnter(id){
  const e = E(id); if(!e) return;

    let o = E(e.owner); if(o && o.kind === 'Region') o = E(o.owner);
    if(!o || o.kind === 'StateMachine'){ SIM.act.clear(); SIM.done = true; simLog('■ Son durum — durum makinesi bitti'); return; }

function simFollow(initId){ const t = Object.values(M.els).find(r => r.kind === 'Transition' && r.src === initId); if(t) simTake(t, true); }
function simExitTree(id){ [...SIM.act].forEach(a => { if(a !== id && simAncestors(a).includes(id)){ const s = E(a); if(s && s.exit) simLog('  exit / ' + s.exit + ' (' + s.name + ')'); SIM.act.delete(a); } }); }

ion, Generalization or Dependency to a new or existing block. If the block grows, the shapes below it are moved down.","Ad düzenle (Not'larda":"Edit name (finish comments with","ile bitir). Akış çizgisinde koşul (guard) düzenler.":"). On a flow line, edits the guard.","Seçiliyi":"Deletes the selection from the","siler (tüm diyagramlardan kalkar)":"(removed from all diagrams)","Yalnızca bu":"Removes it only from this","kaldırır, model elemanı kalır":"; the model element remains","Geri al / yinele":"Undo / redo","Yakınlaş; tekerlek kaydırır;":"Zoom; wheel scrolls;","Boşluk":"Space","veya orta tuş + sürükle tuvali kaydırır":"or middle button + drag pans the canvas","Ok tuşları":"Arrow keys","Seçiliyi 10 px (Shift ile 1 px) taşır;":"Move the selection 10 px (1 px with Shift);","+sürükle ızgarasız taşır":"+drag moves without grid","Bağlantı orta tutamağı":"Connector middle handle","Seçili dik açılı bağlantının orta parçasını sürükleyerek rota ayarlanır":"Drag the middle segment of the selected orthogonal connector to adjust the route","Bükme noktası":"Bend point","Seçili bağlantıdaki turuncu yuvarlakları sürükleyerek bükme noktası ekleyin; kare noktaları taşıyın, çift tıkla silin. Düz çizgide eğik, dik açılıda basamaklı çizilir.":"Drag the orange circles on the selected connector to add bend points; move the square points, double-click to delete them. Drawn slanted on straight lines and stepped on orthogonal ones.","Etiket taşıma":"Moving labels","Seçili bağlantının etiketini (ad, koşul, «stereotip») sürükleyin; sağ tık → Etiket konumunu sıfırla.":"Drag the label of the selected connector (name, guard, «stereotype»); right-click → Reset label position.","Bir şekil/bağlantı seçip Biçim'e basın; tıkladığınız diğer elemanlara renk ve görünüm uygulanır. Esc ile çıkılır.":"Select a shape/connector and press Format; color and appearance are applied to the other elements you click. Esc exits.","Diyagram ekrana sığmadığında sağ altta mini harita çıkar; tıklayarak/sürükleyerek ge s;","işaretlenirse yönler tersine döner.":"if ticked, the directions are reversed.","Değer tipi / birim":"Value type / unit","BDD paletinde Değer Tipi (birim, büyüklük türü), Numaralandırma (her satır bir değer) ve Sinyal.":"In the BDD palette: Value Type (unit, quantity kind), Enumeration (one value per line) and Signal.","Araçlar ▾ → Birim kütüphanesi":"Tools ▾ → Unit library","SI tiplerini ekler; value property'nin tip listesinde görünür.":"Adds SI types; they appear in the value property type list.","Pin / parametre":"Pin / parameter","Pin'i aksiyonun üzerine bırakın (üst yarı = in, alt yarı = out). Aktiviteye":"Drop a pin onto an action (upper half = in, lower half = out). If you add an","eklerseniz onu çağıran aksiyonda pinler otomatik oluşur.":"to an activity, pins are created automatically on the actions calling it.","Sinyal / olay":"Signal / event","Sinyal Gönder, Olay Kabul, Zaman Olayı (":"Send Signal, Accept Event, Time Event (","). Ağaçtan sinyali aktivite diyagramına bırakmak Sinyal Gönder aksiyonu oluşturur. Akışa":"). Dropping a signal from the tree onto an activity diagram creates a Send Signal action. To a flow, an","Kesme akışı":"Interrupting flow","işareti ve Kesilebilir Bölge eklenebilir.":"mark and an Interruptible Region can be added.","Sıralama diyagramında alt/opt/loop/par/break/ref… Operand koşulları Özellikler'de her satıra bir tane; ayırıcılar mavi tutamakla taşınır. Fragment taşınınca içindeki mesajlar da taşınır. Yürütme çubukları otomatik çizilir.":"In sequence diagrams: alt/opt/loop/par/break/ref… Operand guards in Properties, one per line; separators are moved with the blue handle. Moving a fragment also moves the messages inside it. Execution bars are drawn automatically.","Bileşik durum":"Composite state","Bir durumu büyütüp içine durum/başlangıç/geçmiş (H, H*) sürükleyin: model ağacında da o durumun altına taşınır. Bölge (region) ile paralel bölgeler oluşturulur.":"Enlarge a state and drag states/initial/history (H, H*) into it: they are also moved under that state in the model tree. Regions create parallel regions.","Elemanın Özellikler panelinde":"In the element's Properties panel","Stereotipler → + Yeni":"Stereotypes → + New","veya listeden uygula. Stereotipin etiketleri (":"or apply from the list. The stereotype's tags (","ad : tip = varsayılan":"name : type = default",") ve dolgu rengi tanımlanır; değerler elemanda doldurulur ve blokta":") and fill color are defined; values are filled in on the element and shown in the block's","bölmesinde görünür.":"compartment.","Kısıt bloklarının denklemleri (ör.":"Equations of constraint blocks (e.g.","; birden fazlası":"; several separated by","ile) binding connector'larla bağlı value'lar üzerinden çözülür. Varsayılan değeri dolu value'lar girdi, boşlar çıktıdır; sonuç":") are solved over values connected with binding connectors. Values with a default are inputs, empty ones are outputs; the result is","olarak gösterilir. Tek bilinmeyenli denklemler sayısal yöntemle de çözülür.":"shown as. Equations with a single unknown are also solved numerically.","Bütçe analizi":"Budget analysis","Kütle, güç, maliyet gibi bir value property'yi composition ağacı boyunca çoklukları da hesaba katarak toplar; sınır ve tasarım payıyla kalan marjı gösterir, sonucu modele yazar, Excel'e aktarır.":"Rolls up a value property such as mass, power or cost along the composition tree including multiplicities; shows the remaining margin with a limit and design margin, writes the result to the model, exports to Excel.","Aktivite diyagramında token akışı (fork/join, karar dalı seçimi), durum makinesinde aktif durumlar, olay düğmeleri, entry/exit/do günlüğü, bileşik durum ve geçmiş. Adım adım veya otomatik.":"Token flow in activity diagrams (fork/join, decision branch choice), active states in state machines, event buttons, entry/exit/do log, composite states and history. Step by step or automatic.","Aktivite/aksiyon × blok/part; hücreye tıklayınca «allocate» kurulur. Kulvardan gelen dolaylı tahsis ○ ile gösterilir.":"Activity/action × block/part; clicking a cell creates an «allocate». Indirect allocation via swimlanes is shown with ○.","Seçilen türdeki elemanların düzenlenebilir tablosu (stereotip etiketleri sütun olarak); Excel'e aktarılır.":"Editable table of the elements of the selected kind (stereotype tags as columns); exported to Excel.","Seçili elemanın ilişkilerini katmanlı harita olarak gösterir; çift tık merkeze alır.":"Shows the relationships of the selected element as a layered map; double-click centers.","Bağlam bloğunun part'ları (veya tüm modelde blok tipleri) köşegende; hücrede satırdan sütuna giden arayüzler (ID ve akış öğeleri). Tıklayınca bağlantı seçilir, çift tıklayınca IBD açılır.":"Parts of the context block (or block types for the whole model) on the diagonal; cells show the interfaces from row to column (ID and flow items). Click selects the connector, double-click opens the IBD.","Her connector bir arayüz: kaynak/hedef, yön, arayüz bloğu, akış öğeleri modelden; ID, tür, protokol, konnektör, özellikler tabloda. Uyum sütunu yön çelişkisi, eksik akış özelliği, tip ve birim uyumsuzluğunu gösterir. Excel ve Word ICD çıktısı.":"Each connector is an interface: source/target, direction, interface block and flow items from the model; ID, type, protocol, connector and properties in the table. The compliance column shows direction conflicts, missing flow properties, type and unit mismatches. Excel and Word ICD output.","Blok, part ve fonksiyonlar için arıza modları: neden, etkiler, Ş/O/T ve RPN, önlem ve artık RPN, FMECA mod kritikliği (Cm = β·α·λp·t). Önleyici gereksinim bağlanır, doğrulayan testler gösterilir. ⚑ ile riske aktarılır.":"Failure modes for blocks, parts and functions: cause, effects, S/O/D and RPN, action and residual RPN, FMECA mode criticality (Cm = β·α·λp·t). Mitigating requirements are linked and verifying tests shown. ⚑ transfers to a risk.","Olasılık × etki (1–5), seviye, strateji, önlem, sorumlu ve tarih; önlem öncesi/sonrası 5×5 matris (hücreye tıklayınca süzer). Excel ve raporda.":"Probability × impact (1–5), level, strategy, action, owner and date; 5×5 matrix before/after mitigation (click a cell to filter). In Excel and the report.","Durum makinesinin geçişleri liste veya durum × olay matrisi olarak; olay/koşul/etki hücrede düzenlenir; ulaşılamayan, çıkışı olmayan durumlar ve belirsiz geçişler sayılır.":"Transitions of a state machine as a list or a state × event matrix; event/guard/effect edited in the cell; unreachable states, states without exits and nondeterministic transitions are counted.","Rastgele titreşim (PSD), sinüs süpürme, şok tepki spektrumu (SRS) ve termal döngü. Kırılma noktalarından Grms, eğim (dB/oktav), yer değiştirme, süre ve tolerans bandı hesaplanır; Excel'den yapıştırılabilir. İki profil karşılaştırılır (marj, kapsama), birden çoğunun zarfı alınır, ± dB ölçeklenir. Test durumlarına bağlanır; VCRM ve raporda görünür. Gereksinim diyagramında kutu içinde grafikle gösterilir.":"Random vibration (PSD), sine sweep, shock response spectrum (SRS) and thermal cycling. Grms, slope (dB/oct), displacement, duration and tolerance band are calculated from the breakpoints; can be pasted from Excel. Two profiles can be compared (margin, enveloping), several enveloped, scaled in ± dB. Linked to test cases; shown in the VCRM and the report. Shown with a chart in a box on requirement diagrams.","XMI ve şablonlar (Araçlar ▾)":"XMI and templates (Tools ▾)","XMI dışa aktar":"Export XMI","UML 2.5 / SysML 1.6 XMI: paket, blok, arayüz, part/port/value/akış, gereksinim (id, metin), ilişkiler, aktivite ve durum makineleri. Cameo:":"UML 2.5 / SysML 1.6 XMI: packages, blocks, interfaces, part/port/value/flow, requirements (id, text), relationships, activities and state machines. Cameo:",". Diyagram yerleşimi aktarılmaz.":". Diagram layout is not exported.","Cameo/MagicDraw, Papyrus, EA XMI dosyaları \"XMI: …\" paketine aktarılır; istenirse BDD, IBD, use case, aktivite, durum makinesi ve gereksinim diyagramları otomatik oluşturulur.":"Cameo/MagicDraw, Papyrus, EA XMI files are imported into an \"XMI: …\" package; optionally BDD, IBD, use case, activity, state machine and requirement diagrams are created automatically.","MIL-STD-810H (14 yöntem) ve SMC-S-016 kalifikasyon gereksinimleri + test durumları + Verify; proje paket iskeleti.":"MIL-STD-810H (14 methods) and SMC-S-016 qualification requirements + test cases + Verify; project package skeleton.","Gereksinim yönetimi (Gereksinimler ▾)":"Requirement management (Requirements ▾)","Sistem ve alt sistem gereksinimlerini ekleyin (alt sistem eklerken alt sistem adı sorulur; filtrede alt sistemler adlarıyla listelenir), hücreye tıklayıp düzenleyin. Doğrulama yöntemi T/A/M/G (Test, Analiz, Muayene, Gösterim) düğmeleriyle. İzlenebilirlik sütunlarındaki":"Add system and subsystem requirements (the subsystem name is asked when adding a subsystem requirement; subsystems are listed by name in the filter), click a cell to edit. Verification method T/A/I/D (Test, Analysis, Inspection, Demonstration) with the buttons. With the","ile üst gereksinim, alt gereksinim, karşılayan model elemanı, fonksiyon ve test bağlanır.":"in the traceability columns, parent requirement, child requirement, satisfying model element, function and test are linked.","Sütunlar / özellikler":"Columns / attributes","Sütunları gizleyin/gösterin, özel özellik (attribute) ekleyin/silin/yeniden adlandırın, ID öneklerini ayarlayın.":"Hide/show columns, add/delete/rename custom attributes, set ID prefixes.","Şartnameden çıkar":"Extract from specification","Word (.docx) / metin şartnameden zorunluluk ifadesiyle biten cümleler; bölüm numarası (Md. 3.2.1), madde başı ister numarası ([TŞ-014]) ve tablo satırları okunur. Önizlemede kalite rozeti ve mevcutlara benzerlik gösterilir; seçilenler Taslak olarak eklenir.":"Sentences ending in mandatory wording from a Word (.docx) / text specification; section numbers (Md. 3.2.1), leading requirement numbers ([TŞ-014]) and table rows are read. The preview shows a quality badge and similarity to existing ones; the selected ones are added as Draft.","Dışa aktarma":"Export","Excel, Word (gereksinim spesifikasyonu) ve ReqIF çıktısından önce hangi attribute'ların hangi sırayla aktarılacağını, kapsamı (sistem / alt sistem) ve Excel'deki ek sayfaları seçersiniz. Seçim modelle kaydedilir.":"Before Excel, Word (requirements specification) and ReqIF output you choose which attributes are exported in which order, the scope (system / subsystem) and the extra sheets in Excel. The selection is saved with the model.","Satır/sütun kümeleri: sistem, alt sistem, fonksiyonlar, bloklar, model elemanları, testler, use case'ler. Hücreye tıklayınca ilişki kurulur/kaldırılır. Kırmızı başlıklar ilişkisiz satır/sütunlardır.":"Row/column sets: system, subsystem, functions, blocks, model elements, tests, use cases. Clicking a cell creates/removes a relationship. Red headers are rows/columns without relationships.","Karşılanmayan sistem gereksinimleri, yetim alt sistem gereksinimleri, doğrulama yöntemi olmayanlar, gereksinime izlenmeyen bloklar/fonksiyonlar; yüzde göstergeleri.":"Unsatisfied system requirements, orphan subsystem requirements, those without a verification method, blocks/functions not traced to requirements; percentage indicators.","İçe aktarmada sütunlar otomatik eşleşir, isterseniz değiştirin; bilinmeyen sütunlar yeni özellik olur. Üst gereksinim ID'leri Derive ilişkisine dönüşür. ReqIF (.reqif) dosyaları da aynı pencereyle aktarılır. Dışa aktarma: gereksinimler + matrisler + kapsama + kalite + VCRM + test sayfaları; ayrıca ReqIF 1.2 (DOORS, Polarion vb.).":"On import, columns are mapped automatically, change them if you like; unknown columns become new attributes. Parent requirement IDs become Derive relationships. ReqIF (.reqif) files are imported with the same dialog. Export: requirements + matrices + coverage + quality + VCRM + test sheets; also ReqIF 1.2 (DOORS, Polarion etc.).","Durum ve geçmiş":"Status and history","Taslak → İncelemede → Onaylı → Değişiklikte → İptal. Onaylı gereksinimin metni/yöntemi/seviyesi değişirse otomatik \"Değişiklikte\" olur. Her değişiklik kim/ne zaman/eski→yeni ve gerekçeyle kaydedilir (Özellikler → Değişiklik geçmişi). Kullanıcı adı: Gereksinimler ▾ → Kullanıcı adım.":"Draft → In review → Approved → Under change → Cancelled. If the text/method/level of an approved requirement changes, it automatically becomes \"Under change\". Every change is recorded with who/when/old→new and rationale (Properties → Change history). User name: Requirements ▾ → My user name.","INCOSE kurallarıyla metin denetimi: cümle \"-ecek / -acak / -ecektir / -acaktır\" ile bitmeli (Yazım kuralı seçiminden \"-malıdır / -melidir\" de seçilebilir), belirsiz kelimeler, birden fazla ister, birimsiz sayı, TBD, aşırı uzunluk, yinelenen ID, çok benzer gereksinimler.":"Text check with INCOSE rules: the sentence must end with \"-ecek / -acak / -ecektir / -acaktır\" (\"-malıdır / -melidir\" can also be selected with Writing rule), vague words, multiple requirements, numbers without units, TBD, excessive length, duplicate IDs, very similar requirements.","Taban çizgileri":"Baselines","Gereksinim setini adlandırarak dondurun (ör. SRR, PDR); iki taban çizgisini veya taban çizgisini güncel modelle karşılaştırın, farkı Excel'e alın.":"Freeze the requirement set under a name (e.g. SRR, PDR); compare two baselines or a baseline with the current model and export the difference to Excel.","Etki analizi":"Impact analysis","Sağ tık veya Özellikler → \"Etki analizi\": bir eleman değişirse etkilenen gereksinimler, elemanlar, testler ve diyagramlar.":"Right-click or Properties → \"Impact analysis\": the requirements, elements, tests and diagrams affected if an element changes.","Doğrulama ve test":"Verification and test","Prosedür no, yöntem, doğrulama seviyesi, test edilen birim, standart, sorumlu, planlanan tarihler, sonuç (Planlandı / Yapılmadı / Geçti / Kaldı / Koşullu), sonuç tarihi, rapor no. Sonuç diyagramda rozet olarak görünür.":"Procedure no, method, verification level, item under test, standard, owner, planned dates, result (Planned / Not performed / Passed / Failed / Conditional), result date, report no. The result is shown as a badge on the diagram.","Gereksinim × T/A/M/G, seviye, test/prosedür, sonuç, rapor no ve hesaplanan doğrulama durumu (Doğrulandı / Kısmen / Kaldı / Planlandı / Faaliyet yok).":"Requirement × T/A/I/D, level, test/procedure, result, report no and calculated verification status (Verified / Partially / Failed / Planned / No activity).","Test kampanyası":"Test campaign","Testlerin düzenlenebilir tablosu ve zaman çizelgesi (Gantt); seviyeye, sonuca, birime göre gruplama; gecikmiş testler kırmızı çerçeveli. Excel'den test sonuçları geri aktarılabilir (prosedür no veya ada göre eşleşir).":"Editable table and timeline (Gantt) of tests; grouping by level, result, item; overdue tests with a red border. Test results can be imported back from Excel (matched by procedure no or name).","Model karşılaştır":"Compare models","Başka bir .sysml dosyasıyla eleman bazında fark (eklenen / silinen / değişen, kelime düzeyinde metin farkı); farkları işaretleyip bu modele uygulama (Ctrl+Z ile geri alınır); Excel'e aktarma.":"Element-level differences with another .sysml file (added / deleted / changed, word-level text differences); tick differences and apply them to this model (undo with Ctrl+Z); export to Excel.","Seçili elemanın Özellikler panelinin altından not ekleyin, yanıtlayın, kapatın. Açık notlu elemanlar diyagramda sarı rozetle görünür; Araçlar ▾ → İnceleme notları tüm notları listeler.":"Add notes at the bottom of the selected element's Properties panel, reply, close. Elements with open notes show a yellow badge on the diagram; Tools ▾ → Review notes lists all notes.","Seçilen bölümler ve diyagramlarla Word (.docx; içindekiler, sayfa numarası, şekil başlıkları) veya yazdırılabilir HTML rapor.":"Word (.docx; table of contents, page numbers, figure captions) or printable HTML report with the selected sections and diagrams.","Tipsiz part, isimsiz/aynı adlı eleman, kopuk ilişki, başlangıç/bitişi olmayan aktivite, ulaşılamayan durum, aktörsüz use case, döngüsel kompozisyon/kalıtım, port yön uyumsuzluğu, bağlantısız test… Satıra tıklayınca eleman gösterilir.":"Untyped part, unnamed/duplicate-named element, dangling relationship, activity without initial/final, unreachable state, use case without actor, circular composition/inheritance, port direction mismatch, unlinked test… Clicking a row shows the element.","Başka bir .sysml dosyasından seçilen paketleri hedef pakete aktarır. Aynı kimlikli elemanlar güncellenir, atlanır veya kopya olarak eklenir.":"Imports selected packages from another .sysml file into a target package. Elements with the same ID are updated, skipped or added as copies.","Düzenleme kısayolları":"Editing shortcuts","Kopyala / yapıştır. Başka diyagrama yapıştırınca aynı elemanlar gösterilir; aynı diyagramda yeni eleman olarak kopyalanır.":"Copy / paste. Pasting into another diagram shows the same elements; on the same diagram they are copied as new elements.","her zaman yeni eleman,":"always new elements,","çoğaltır.":"duplicates.","Komut paleti: tüm komutlar, menü öğeleri, görünümler, diyagramlar ve elemanlar (ad, ID) tek kutudan; ↑↓ ile seçip Enter.":"Command palette: all commands, menu items, views, diagrams and elements (name, ID) from one box; choose with ↑↓ and press Enter.","Model içinde ara (ad, ID, metin, açıklama, özellik değerleri).":"Search in the model (name, ID, text, description, attribute values).","Ağaçta çoklu seçim":"Multi-select in the tree","+ tık; seçilenler diyagrama birlikte sürüklenir, aralarındaki ilişkiler çizilir.":"+ click; the selected elements are dragged to the diagram together and the relationships between them are drawn.","Bağlantı ucu":"Connector end","Seçili bağlantının uç tutamacını başka elemana sürükleyerek yeniden bağlayın.":"Drag the end handle of the selected connector onto another element to reconnect it.","Özellikler → Görünüm: dolgu ve çizgi rengi, blok bölmelerini gizleme, diyagram yazı boyutu; aktivitede yatay kulvar.":"Properties → Appearance: fill and line color, hiding block compartments, diagram font size; horizontal swimlanes in activities.","Otomatik düzen ve hizalama":"Auto layout and alignment","Düzen ▾ /":"Layout ▾ /","Diyagram türüne özel düzenler: BDD'de hiyerarşik (bütün üstte, parçalar altta; genelleme üst sınıf üstte), ızgara, dairesel. IBD'de bağlantı yönüne göre akış (out → in), portlar karşı tarafa bakacak şekilde yeniden dizilir. Use case'te aktörler solda ya da iki yanda, use case'ler sistem sınırı içinde, include/extend sağa doğru. Aktivitede akış sırası; kulvarlar varsa her düğüm kendi kulvarında kalır.":"Layouts specific to each diagram type: hierarchical on BDDs (whole on top, parts below; generalization superclass on top), grid, circular. On IBDs, flow by connector direction (out → in), with ports rearranged to face the other side. On use case diagrams, actors on the left or on both sides, use cases inside the system boundary, include/extend to the right. On activities, flow order; with swimlanes each node stays in its own lane.","Toparla":"Tidy","Mevcut yerleşimi koruyup çakışmaları giderir ve ızgaraya oturtur.":"Keeps the current layout, removes overlaps and snaps to the grid.","Birden fazla şekil seçiliyken: sola/sağa/üste/alta hizala, ortala, eşit aralıkla dağıt, aynı boyut. Sağ tık menüsünde de vardır.":"With several shapes selected: align left/right/top/bottom, center, distribute evenly, same size. Also in the right-click menu.","Geri alma":"Undo","Her düzen tek adımda":"Each layout is undone in a single step with","ile geri alınır.":".","İkonlar":"Icons","İkon ata":"Assign icon","Blok, part veya aktör seçip araç çubuğundaki":"Select a block, part or actor and use the toolbar","düğmesi, sağ tık → \"İkon ata…\" veya Özellikler panelinden. 10 kategoride 200'e yakın ikon, aramalı. Birden çok eleman seçiliyse hepsine birden atanır.":"button, right-click → \"Assign icon…\" or the Properties panel. About 200 icons in 10 categories, searchable. If several elements are selected, the icon is assigned to all of them.","Blokta \"köşede küçük\" veya \"başlıkta büyük\"; renk kategoriden gelir, istenirse değiştirilir. Part'lar ve nesne düğümleri ikonu tip bloğundan otomatik alır; ağaçta da görünür.":"On a block \"small in corner\" or \"large in header\"; the color comes from the category and can be changed. Parts and object nodes take the icon from their type block automatically; it also shows in the tree.","Modelle senkron davranışlar":"Behaviors synchronized with the model","Bütün blokta hedef blok tipinde otomatik":"Automatically creates a","oluşturur; bloğun \"parts\" bölmesinde görünür.":"of the target block type in the whole block; shown in the block's \"parts\" compartment.","Part'a bırakılan port, part'ın tip bloğuna eklenir; BDD'de bloğun \"ports\" bölmesinde görünür.":"A port dropped on a part is added to the part's type block; shown in the block's \"ports\" compartment on BDDs.","IBD oluşturma":"Creating an IBD","Bloğun mevcut part'ları, portları ve connector'ları otomatik yerleştirilir.":"The block's existing parts, ports and connectors are placed automatically.","Ad değişikliği":"Renaming","Ağaçta, tüm diyagramlarda ve özelliklerde anında güncellenir.":"Updated immediately in the tree, on all diagrams and in properties.","Kayıt":"Saving","Model tarayıcının yerel deposunda otomatik saklanır (aynı bilgisayar/tarayıcı).":"The model is stored automatically in the browser's local storage (same computer/browser).",".sysml.json dosyası indirir; \"Aç\" ile geri yüklenir.":"Downloads a .sysml.json file; restore it with \"Open\".","HTML olarak kaydet":"Save as HTML","Modeli içine gömülü uygulama dosyası üretir; paylaştığınız kişi açınca modeli hazır görür.":"Creates an application file with the model embedded; whoever you share it with sees the model ready when opening it.","PNG, SVG, panoya kopyalama; tek diyagram, açık sekmeler veya tüm diyagramlar için çok sayfalı":"PNG, SVG, copy to clipboard; multi-page","(A4/A3, yön otomatik); yazdırma. Diyagram özelliklerinden SysML çerçevesi gizlenebilir.":"for a single diagram, open tabs or all diagrams (A4/A3, auto orientation); printing. The SysML frame can be hidden in the diagram properties.","Eski / bozuk dosya":"Old / corrupt file","Önceki sürümlerin dosyaları açılırken otomatik yükseltilir; sahipsiz eleman, ucu kopuk ilişki, geçersiz diyagram şekli gibi tutarsızlıklar onarılır ve bildirilir.":"Files from earlier versions are upgraded automatically when opened; inconsistencies such as orphan elements, dangling relationships, invalid diagram shapes are repaired and reported.","Büyük modeller":"Large models","Gereksinim tablosu ve kapsama analizi 250'şer satır gösterir; alttaki düğmelerle devamı açılır.":"The requirement table and coverage analysis show 250 rows at a time; open the rest with the buttons below.","🖌 Biçim":"🖌 Format","Analiz ▾":"Analysis ▾","Araçlar ▾":"Tools ▾","Dışa aktar ▾":"Export ▾","İlişki haritası":"Relation map","Genel tablo":"Generic table","Risk kaydı":"Risk register","Kaydet":"Save","XMI içe aktar":"Import XMI","Şablon ekle":"Add template","Diyagramları otomatik oluştur (BDD, IBD, aktivite, durum makinesi, use case)":"Create diagrams automatically (BDD, IBD, activity, state machine, use case)","Gereksinim diyagramı oluştur":"Create requirement diagram","Model, kökte \"XMI: …\" adlı yeni bir paketin içine aktarılır. Cameo/MagicDraw, Papyrus ve Enterprise Architect'in UML 2.x / SysML 1.x XMI dosyalarında paket, blok, arayüz bloğu, part, port, değer, akış özelliği, değer tipi, numaralandırma, sinyal, gereksinim (id/metin), test durumu, kısıt bloğu, ilişkiler (composition, generalization, association, satisfy, derive, verify, refine, trace, allocate, dependency), aktör, use case, aktivite ve durum makineleri okunur. Diyagram yerleşimleri XMI'da standart olmadığından aktarılmaz.":"The model is imported into a new package named \"XMI: …\" at the root. From UML 2.x / SysML 1.x XMI files of Cameo/MagicDraw, Papyrus and Enterprise Architect, packages, blocks, interface blocks, parts, ports, values, flow properties, value types, enumerations, signals, requirements (id/text), test cases, constraint blocks, relationships (composition, generalization, association, satisfy, derive, verify, refine, trace, allocate, dependency), actors, use cases, activities and state machines are read. Diagram layouts are not imported because they are not standard in XMI.","Aktar":"Import","MIL-STD-810H çevresel kalifikasyon":"MIL-STD-810H environmental qualification","14 test yöntemi (500.6 alçak basınç … 517.3 piroteknik şok) için sistem gereksinimi + kalifikasyon test durumu + Verify ilişkisi. Seviyeler [TBD] olarak gelir; kalite raporu doldurulmamışları listeler.":"System requirement + qualification test case + Verify relationship for 14 test methods (500.6 low pressure … 517.3 pyroshock). Levels come as [TBD]; the quality report lists the unfilled ones.","SMC-S-016 uzay aracı kalifikasyon testleri":"SMC-S-016 spacecraft qualification tests","Akustik, rastgele/sinüs titreşim, şok, termal vakum, termal döngü, basınç, statik yük, EMC, kütle özellikleri.":"Acoustic, random/sine vibration, shock, thermal vacuum, thermal cycling, pressure, static load, EMC, mass properties.","01 Gereksinimler … 07 Doğrulama paket yapısı, SI birim kütüphanesi ve «LRU» stereotipi.":"Package structure 01 Gereksinimler … 07 Doğrulama, SI unit library and «LRU» stereotype.","Doğrulanan birim (test edilen)":"Verified item (under test)","Test durumlarını ve Verify ilişkilerini oluştur":"Create test cases and Verify relationships","Ekle":"Add","Bağlam":"Context","Varsayılan değeri dolu olan value property'ler":"Value properties with a default value are taken as",", boş olanlar":", empty ones a
