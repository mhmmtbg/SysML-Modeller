<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>SysML Modelleyici</title>
<style>
:root{--bg:#e9edf2;--panel:#f7f8fa;--line:#c8cfd9;--acc:#2d7ff9;--txt:#1e2733;--mut:#6b7686}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px "Segoe UI",Arial,sans-serif;color:var(--txt);background:var(--bg);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#toolbar{display:flex;align-items:center;gap:3px;padding:5px 8px;background:#26364b;color:#fff;flex-wrap:wrap}
#toolbar .brand{font-weight:600;margin-right:10px;letter-spacing:.3px}
#toolbar button{background:#34475f;color:#fff;border:1px solid #46607f;border-radius:4px;padding:4px 7px;font:inherit;font-size:12.5px;cursor:pointer}
#toolbar button:hover{background:#41597a}
#toolbar .sep{width:1px;height:20px;background:#4b5f7a;margin:0 5px}
#toolbar #zoomLbl{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#main{flex:1;display:flex;min-height:0}
#left{width:300px;min-width:180px;display:flex;flex-direction:column;background:var(--panel)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:#dde3ea;border-bottom:1px solid var(--line);font-weight:600;font-size:12px;color:#334}
.ph button{border:1px solid var(--line);background:#fff;border-radius:3px;font-size:11px;padding:1px 6px;cursor:pointer}
#treeBox{flex:1.3;min-height:60px;overflow:auto;padding:3px 0;outline:none}
#hsplit{height:5px;cursor:row-resize;background:var(--line)}
#vsplit{width:5px;cursor:col-resize;background:var(--line)}
#propsBox{flex:1;min-height:60px;overflow:auto;display:flex;flex-direction:column}
#props{padding:8px;overflow:auto}
.tr{display:flex;align-items:center;gap:4px;padding:2px 6px 2px 0;white-space:nowrap;cursor:default;user-select:none}
.tr:hover{background:#e6edf7}
.tr.sel{background:#cfe0fb}
.tr.drop{outline:2px dashed var(--acc);outline-offset:-2px}
.tw{width:14px;text-align:center;color:#667;cursor:pointer;flex:none;font-size:10px}
.ic{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:16px;padding:0 3px;border-radius:3px;font-size:10px;font-weight:700;color:#fff;flex:none}
.nm{overflow:hidden;text-overflow:ellipsis}
.kd{color:var(--mut);font-size:11px;margin-left:4px}
.tr input{font:inherit;padding:0 3px;border:1px solid var(--acc);width:170px}
.grp{color:var(--mut);font-style:italic}
#palette{width:158px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;flex:none}
.pg{padding:6px 8px 2px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.pi{display:flex;align-items:center;gap:7px;margin:1px 5px;padding:4px 6px;border-radius:4px;cursor:grab;user-select:none;border:1px solid transparent}
.pi:hover{background:#e3eaf4}
.pi.on{background:#cfe0fb;border-color:var(--acc)}
.pi svg{flex:none}
.pnote{padding:10px;color:var(--mut);font-size:12px;line-height:1.5}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:1px;background:#d5dbe3;border-bottom:1px solid var(--line);min-height:30px;overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;background:#e8ecf1;cursor:pointer;white-space:nowrap;border-top:2px solid transparent}
.tab.cur{background:#fff;border-top-color:var(--acc)}
.tab .x{color:#889;padding:0 3px;border-radius:3px}
.tab .x:hover{background:#d8dde4;color:#c00}
.tab .ti{font-size:10px;font-weight:700;color:#fff;border-radius:3px;padding:1px 4px}
#canvasWrap{flex:1;position:relative;overflow:hidden;background:#fff}
#canvasWrap.tool #svg{cursor:crosshair}
#svg{width:100%;height:100%;display:block;user-select:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;line-height:1.7;pointer-events:none;padding:30px}
#inl{position:absolute;display:none;z-index:20;font:12px "Segoe UI",Arial,sans-serif;border:1.5px solid var(--acc);padding:3px 4px;resize:none;text-align:center;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#status{display:flex;gap:16px;padding:3px 10px;background:#dde3ea;border-top:1px solid var(--line);font-size:11.5px;color:#445}
#status .hint{margin-left:auto;color:var(--mut)}
#ctx{position:fixed;display:none;z-index:100;background:#fff;border:1px solid #b9c2ce;box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:5px;padding:4px 0;min-width:200px;max-height:80vh;overflow:auto}
#ctx .mi{padding:5px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:20px}
#ctx .mi:hover{background:#e3ecfa}
#ctx .mi.dis{color:#aaa;pointer-events:none}
#ctx .mh{padding:5px 12px 2px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--mut);letter-spacing:.4px}
#ctx .sep{height:1px;background:#e2e6eb;margin:4px 0}
#ctx .k{color:#99a;font-size:11px}
.pt{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:8px;font-size:13px}
.pf{display:grid;grid-template-columns:82px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.pf label{color:#556;font-size:12px}
.pf input,.pf select,.pf textarea{font:inherit;font-size:12px;padding:3px 5px;border:1px solid #bfc8d3;border-radius:3px;width:100%;background:#fff}
.pf textarea{min-height:54px;resize:vertical}
.pf input[type=color]{padding:0;height:24px;width:48px}
.lnk{color:var(--acc);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline}
.sub{margin:10px 0 4px;font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e2e6eb;padding-top:8px}
.sub button,.pbtn{border:1px solid #bfc8d3;background:#fff;border-radius:3px;font-size:11px;padding:2px 7px;cursor:pointer}
.li{padding:2px 0 2px 6px;font-size:12px}
.muted{color:var(--mut);font-size:12px}
#modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:200}
#modal .box{background:#fff;border-radius:8px;max-width:720px;max-height:85vh;overflow:auto;padding:18px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3);line-height:1.55}
#modal h2{margin:0 0 8px;font-size:17px}
#modal h3{margin:14px 0 4px;font-size:14px}
#modal table{border-collapse:collapse;font-size:12.5px}
#modal td{padding:2px 12px 2px 0;vertical-align:top}
#modal kbd{background:#eef1f5;border:1px solid #c8cfd9;border-radius:3px;padding:0 4px;font-size:11.5px}
.nat{display:none}
.icbar{display:flex;gap:8px;align-items:center;margin:6px 0 8px}
.icbar input{flex:1;font:inherit;padding:6px 9px;border:1px solid #bfc8d3;border-radius:5px}
.iccats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{border:1px solid #cfd6df;background:#f5f7fa;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{background:#26364b;color:#fff;border-color:#26364b}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;max-height:52vh;overflow:auto;padding:2px}
.icb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 7px;border:1px solid #e0e5eb;border-radius:7px;background:#fff;cursor:pointer;font:11px "Segoe UI",Arial,sans-serif;color:#334;line-height:1.2;text-align:center}
.icb:hover{border-color:var(--acc);background:#f0f6ff}
.icb.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(45,127,249,.35)}
.icprev{display:inline-flex;vertical-align:middle;margin-right:4px}
.icsw{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.icsw b{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #c8cfd9}
.icsw b.on{box-shadow:0 0 0 2px #26364b}
#view{position:absolute;inset:0;display:none;flex-direction:column;background:#f4f6f9}
.vbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:7px 10px;background:#fff;border-bottom:1px solid var(--line)}
.vbar label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:#445}
.vbar select,.vbar input:not([type]){font:inherit;font-size:12px;padding:4px 6px;border:1px solid #bfc8d3;border-radius:4px}
.vbar input[data-vf="q"]{width:210px}
.vb{border:1px solid #bfc8d3;background:#fff;border-radius:4px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
.vb:hover{border-color:var(--acc)}
.vb.pri,.pbtn.pri{background:#8e44ad;color:#fff;border-color:#8e44ad}
.vb.pri2{background:#2e86c1;color:#fff;border-color:#2e86c1}
.vsep{width:1px;height:20px;background:#d5dbe3;margin:0 3px}
.vchk{font-size:12px;cursor:pointer}
.vbody{flex:1;overflow:auto;padding:10px}
.vempty{padding:60px;text-align:center;color:var(--mut);line-height:1.6}
.vfoot{padding:8px 2px;color:var(--mut);font-size:12px}
.vfoot b.bad{color:#c0392b}
table.rt{border-collapse:separate;border-spacing:0;background:#fff;font-size:12.5px;border:1px solid #cfd6df}
table.rt th{position:sticky;top:0;z-index:2;background:#26364b;color:#fff;font-weight:600;text-align:left;padding:6px 8px;border-right:1px solid #3d5070;cursor:pointer;white-space:nowrap;font-size:12px}
table.rt th.th-tr{background:#6c3483}
table.rt th.th-cu{background:#2e6f8e}
table.rt td{border-top:1px solid #e3e7ec;border-right:1px solid #eef1f4;padding:3px 6px;vertical-align:top}
table.rt tr.sel td{background:#e8f0fe}
table.rt tr.lv-a td.rn{border-left:3px solid #2e86c1}
table.rt tr.lv-s td.rn{border-left:3px solid #8e44ad}
td.rn{color:#99a;font-size:11px;text-align:right;width:28px}
.ce{min-height:20px;padding:2px 3px;border-radius:3px;outline:none;white-space:pre-wrap;word-break:break-word;max-width:220px}
.ce.long{max-width:440px;min-width:260px}
.ce.rid{font-weight:700;white-space:nowrap;max-width:none}
.ce:hover{background:#f3f6fa}
.ce:focus{background:#fffbe6;box-shadow:inset 0 0 0 1.5px #d18a00}
table.rt select{font:inherit;font-size:12px;border:1px solid transparent;background:transparent;padding:1px}
table.rt select:hover{border-color:#bfc8d3}
.vchips{display:inline-flex;gap:2px}
.vchips b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;border:1px solid #cfd6df;color:#99a;font-size:11px;cursor:pointer;background:#fff;user-select:none}
.vchips b.on{background:#2e7d32;border-color:#2e7d32;color:#fff}
.tcell{display:flex;flex-wrap:wrap;gap:3px;align-items:center;min-width:120px}
.chip2{display:inline-flex;align-items:center;background:#eef2f8;border:1px solid #d5dde8;border-radius:10px;padding:0 7px;font-size:11.5px;line-height:18px;margin:1px 2px 1px 0}
.tadd{border:1px dashed #b7c0cc;background:#fff;color:#678;border-radius:9px;width:20px;height:18px;font-size:12px;line-height:14px;cursor:pointer;padding:0}
.tadd:hover{border-color:var(--acc);color:var(--acc)}
.tdel{border:none;background:none;color:#b0b7c0;cursor:pointer;font-size:12px}
.tdel:hover{color:#c0392b}
.cov{display:inline-block;padding:1px 8px;border-radius:9px;font-size:11px;font-weight:700;white-space:nowrap}
.cov-Tam{background:#d9f2df;color:#1e7a3c}.cov-Kısmi{background:#fff3cd;color:#8a6100}.cov-Eksik{background:#f8d7da;color:#a52834}
.gapt{color:#a5512a;font-size:11px;line-height:1.35;margin-top:3px}
.gaps{margin-top:8px;padding:7px 9px;background:#fff6e5;border:1px solid #f1d9a6;border-radius:5px;color:#8a5200;font-size:11.5px;line-height:1.5}
.trl{margin:6px 0 4px;font-size:12px}
.trl b{font-weight:600;color:#445}
.miss{color:#c0392b;font-weight:700}
table.mx{border-collapse:separate;border-spacing:0;background:#fff;font-size:12px;border:1px solid #cfd6df}
table.mx th,table.mx td{border-right:1px solid #e3e7ec;border-bottom:1px solid #e3e7ec}
table.mx thead th{position:sticky;top:0;z-index:2;background:#26364b;color:#fff}
th.mxc{position:sticky;left:0;z-index:3!important;min-width:240px;text-align:left;padding:6px;font-size:11px;vertical-align:bottom}
th.mxh{height:170px;width:30px;min-width:30px;padding:4px 0;vertical-align:bottom}
th.mxh div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:500;font-size:11.5px;margin:0 auto;max-height:165px;overflow:hidden}
th.mxh.zero{background:#a52834!important}
th.mxh.tot{background:#3d5070!important}
th.mxr{position:sticky;left:0;z-index:1;background:#fff;text-align:left;padding:3px 8px;font-weight:500;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
th.mxr.zero{background:#fbe3e5;box-shadow:inset 3px 0 0 #c0392b}
th.mxr.tot{background:#eef1f5;font-weight:700}
td.mxd{width:30px;height:24px;text-align:center;cursor:pointer;color:#6c3483;font-weight:700}
td.mxd:hover{background:#efe4f6}
td.mxd.on{background:#e6d3f1}
td.mxd.na{background:#f5f6f8;cursor:default}
td.mxt{text-align:center;font-weight:700;color:#445;background:#f7f8fa}
td.mxt.zero{color:#c0392b;background:#fbe3e5}
.vcrm th.vm{text-align:center;width:26px;padding:6px 4px}
td.vmc{text-align:center;font-weight:700;color:#2e7d32;cursor:pointer;position:relative;min-width:24px}
td.vmc:hover{background:#eef6ee}td.vmc.on{background:#f1f8f1}
td.vmc i{position:absolute;right:3px;bottom:3px;width:7px;height:7px;border-radius:50%}
.ganttw{overflow:auto;border:1px solid #cfd6df;border-radius:6px;background:#fff;max-height:52vh}
.gantt{display:block}
table.tct input,table.tct select{font:inherit;font-size:12px;border:1px solid transparent;background:transparent;padding:2px 3px;border-radius:3px;max-width:170px}
table.tct input:not([type=date]){min-width:90px}
table.tct input:hover,table.tct select:hover{border-color:#bfc8d3}
table.tct input:focus{border-color:#d18a00;background:#fffbe6;outline:none}
table.tct tr.late td.rn{border-left:3px solid #c0392b}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:16px}
.card{background:#fff;border:1px solid #dde3ea;border-radius:8px;padding:12px 14px}
.cv{font-size:26px;font-weight:700;color:#26364b}
.ct{font-size:12px;color:#445;margin-top:2px}
.cs{font-size:11px;color:var(--mut);margin-top:4px}
.cbar{height:5px;background:#eef1f5;border-radius:3px;margin-top:8px;overflow:hidden}.cbar i{display:block;height:100%}
.vbody h3{margin:16px 0 8px;font-size:14px;color:#26364b}
table.cvt td{padding:5px 7px}
.cvtx{max-width:340px}
.untr{background:#fff;border:1px solid #dde3ea;border-radius:6px;padding:10px 12px;line-height:1.8;font-size:12.5px}
.plist{max-height:52vh;overflow:auto;border:1px solid #e0e5eb;border-radius:6px;padding:4px}
.pli{display:flex;align-items:center;gap:7px;padding:4px 6px;border-radius:4px;cursor:pointer;font-size:12.5px;flex-wrap:wrap}
.pli:hover{background:#f0f6ff}
.pli em{flex-basis:100%;padding-left:46px;color:var(--mut);font-size:11px;font-style:normal}
table.cm{width:100%;border-collapse:collapse;font-size:12.5px}
table.cm td,table.cm th{padding:4px 6px;border-bottom:1px solid #eef1f4;text-align:left}
table.cm input:not([type]){font:inherit;padding:2px 5px;border:1px solid #bfc8d3;border-radius:3px;width:100%}
.imwrap{max-height:48vh;overflow:auto}
table.imt td{padding:5px 8px;vertical-align:middle}
table.imt select{font:inherit;font-size:12px;padding:3px;border:1px solid #bfc8d3;border-radius:3px;min-width:240px}
.qok{color:#2e7d32;font-weight:700}.qwarn{color:#b9770e;font-weight:700;cursor:help}.qerr{color:#c0392b;font-weight:700;cursor:help}.qinfo{color:#2e86c1;font-weight:700;cursor:help}
.q-hata{color:#a52834}.q-uyarı{color:#8a5a00}.q-bilgi{color:#2e6f8e}
.stc{display:inline-block;color:#fff;border-radius:9px;padding:0 8px;font-size:11px;font-weight:600;line-height:17px;white-space:nowrap}
select.stsel{font-weight:700}
del{background:#fbe3e5;color:#a52834;text-decoration:line-through}ins{background:#d9f2df;color:#1e6b35;text-decoration:none}
.bll{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.blc{background:#fff;border:1px solid #dde3ea;border-radius:6px;padding:6px 10px;display:flex;gap:10px;align-items:center;font-size:12.5px}
tr.d-add td{background:#f0faf3}tr.d-del td{background:#fdf1f2}tr.d-chg td{background:#fffaf0}
.dchip{display:inline-block;border-radius:9px;padding:0 8px;font-size:11px;font-weight:700}.dchip.d-add{background:#d9f2df;color:#1e7a3c}.dchip.d-del{background:#f8d7da;color:#a52834}.dchip.d-chg{background:#fff3cd;color:#8a6100}
.itree{background:#fbfcfd;border:1px solid #e3e7ec;border-radius:6px;padding:4px;max-height:30vh;overflow:auto}
.itl{padding:2px 6px;font-size:12.5px;line-height:1.6}
.hli{font-size:11.5px;border-left:3px solid #d5dde8;padding:2px 0 2px 7px;margin:4px 0}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#26364b;color:#fff;padding:7px 14px;border-radius:5px;display:none;z-index:300;font-size:12.5px}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="brand">SysML Modelleyici</span>
    <button data-act="new" title="Yeni proje">Yeni</button>
    <button data-act="open" title="JSON veya gömülü HTML model dosyası aç">Aç</button>
    <button data-act="save" title="Modeli kaydet (Ctrl+S)">Kaydet</button>
    <button data-act="saveAs" class="nat" title="Farklı kaydet (Ctrl+Shift+S)">Farklı kaydet</button>
    <button data-act="saveHtml" title="Modeli içine gömülü HTML olarak kaydet (paylaşım için)">HTML olarak kaydet</button>
    <span class="sep"></span>
    <button data-act="navBack" title="Önceki diyagram (Alt+←)">◀</button>
    <button data-act="navFwd" title="Sonraki diyagram (Alt+→)">▶</button>
    <span class="sep"></span>
    <button data-act="undo" title="Geri al (Ctrl+Z)">↶ Geri</button>
    <button data-act="redo" title="Yinele (Ctrl+Y)">↷ İleri</button>
    <span class="sep"></span>
    <button data-act="png" title="Diyagramı PNG olarak indir">PNG</button>
    <button data-act="svg" title="Diyagramı SVG olarak indir">SVG</button>
    <button data-act="copy" title="Diyagramı panoya resim olarak kopyala">Panoya kopyala</button>
    <span class="sep"></span>
    <button data-act="zout" title="Uzaklaş">−</button>
    <span id="zoomLbl">100%</span>
    <button data-act="zin" title="Yakınlaş">+</button>
    <button data-act="fit" title="Diyagramı ekrana sığdır">Sığdır</button>
    <button data-act="grid" title="Izgara göster/gizle">Izgara</button>
    <span class="sep"></span>
 <button data-act="reqMenu" title="Gereksinim tablosu, izlenebilirlik matrisi, kapsama analizi, Excel" style="background:#6c3483;border-color:#8e44ad">Gereksinimler ▾</button>
    <button data-act="layoutMenu" title="Otomatik düzen ve hizalama (Ctrl+Shift+L)">Düzen ▾</button>
    <button data-act="iconMenu" title="Seçili blok/part/aktöre ikon ata">İkon</button>
    <span class="sep"></span>
    <button data-act="help">Yardım</button>
  </div>
  <div id="main">
    <div id="left">
      <div class="ph"><span>Model Ağacı</span><span><button data-act="expandAll" title="Tümünü aç">+</button> <button data-act="collapseAll" title="Tümünü kapat">−</button></span></div>
      <div id="treeBox" tabindex="0"><div id="tree"></div></div>
      <div id="hsplit"></div>
      <div id="propsBox"><div class="ph"><span>Özellikler</span></div><div id="props"></div></div>
    </div>
    <div id="vsplit"></div>
    <div id="palette"></div>
    <div id="center">
      <div id="tabs"></div>
      <div id="canvasWrap">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="empty"></div>
        <div id="view"></div>
        <textarea id="inl" rows="1"></textarea>
      </div>

function kidsOf(id){ const r = []; for(const k in M.els){ const e = M.els[k]; if(e.owner === id) r.push(e); } return r; }
function nearestPkg(id){ let e = E(id); while(e && e.kind !== 'Package' && e.kind !== 'Model') e = E(e.owner); return e ? e.id : M.rootId; }
function isAnc(a, b){ let e = E(b); while(e){ if(e.owner === a) return true; e = E(e.owner); } return false; }
function lcFirst(s){ s = String(s || '').replace(/\s+/g, ''); return s ? s.charAt(0).toLocaleLowerCase('tr') + s.slice(1) : s; }
function uniqName(base, owner){ const n = new Set(kidsOf(owner).map(e => e.name)); if(!n.has(base)) return base; let i = 2; while(n.has(base + i)) i++; return base + i; }
function defName(kind, owner){ const b = BASE[kind]; if(!b) return ''; const n = new Set(kidsOf(owner).map(e => e.name)); let i = 1; while(n.has(b + i)) i++; return b + i; }

function elLabel(e){

function canOwn(ownerKind, childKind, child){
  if(childKind === 'Diagram'){
    const dt = child && child.dtype;

    if(dt === 'act') return ownerKind === 'Activity';
    if(dt === 'uc' || dt === 'req' || dt === 'pkg') return ownerKind === 'Package' || ownerKind === 'Model';
    if(dt === 'stm') return ownerKind === 'StateMachine';

function validate(kind, a, b, d){

  if(kind === 'Anchor') return (a.kind === 'Comment' || b.kind === 'Comment') ? '' : 'Not bağlantısının bir ucu Not olmalı.';
  if(K.includes('Comment')) return 'Notlar yalnızca "Not Bağlantısı" ile bağlanır.';
  if(K.includes('Partition')) return 'Kulvarlar bağlantı ucu olamaz.';
  switch(kind){
    case 'Composition': case 'Aggregation': return (a.kind === 'Block' && b.kind === 'Block') ? '' : 'Composition/Aggregation iki Blok arasında olmalı.';
    case 'Association':
      if(d.dtype === 'uc') return (K.includes('Actor') && (K.includes('UseCase') || K.includes('Subject'))) ? '' : 'Use Case diyagramında Association, Aktör ile Use Case arasında olmalı.';
      return K.every(k => k === 'Block' || k === 'Actor') ? '' : 'Association Blok/Aktör arasında olmalı.';
    case 'Generalization': return a.kind === b.kind ? '' : 'Generalization aynı türdeki elemanlar arasında olmalı.';
    case 'Include': case 'Extend': return (a.kind === 'UseCase' && b.kind === 'UseCase') ? '' : kind + ' iki Use Case arasında olmalı.';
    case 'Connector': return K.every(k => ['Part','Port','Value'].includes(k)) ? '' : 'Connector part/port/value arasında olmalı.';
    case 'ControlFlow': case 'ObjectFlow':
      if(a.kind === 'Final' || a.kind === 'FlowFinal') return 'Bitiş düğümünden akış çıkamaz.';
      if(b.kind === 'Initial') return 'Başlangıç düğümüne akış giremez.';
      return '';
    case 'Dependency': return '';

    case 'Satisfy': return b.kind === 'Requirement' && a.kind !== 'Requirement' ? '' : 'Satisfy, model elemanından gereksinime çizilmeli.';
    case 'Verify': return b.kind === 'Requirement' && a.kind !== 'Requirement' ? '' : 'Verify, test durumundan gereksinime çizilmeli.';
    case 'Refine': case 'Trace': return (a.kind === 'Requirement' || b.kind === 'Requirement') ? '' : kind + ' ilişkisinin bir ucu gereksinim olmalı.';
    case 'Allocate': return (['Activity','Action'].includes(a.kind) && ['Block','Part'].includes(b.kind)) ? '' : 'Allocate, fonksiyondan (aktivite/aksiyon) bloğa/part\'a çizilmeli.';

      if(![a.kind, b.kind].every(k => ['State','Initial','Final','Choice'].includes(k))) return 'Geçiş durumlar arasında olmalı.';
      if(a.kind === 'Final') return 'Son durumdan geçiş çıkamaz.';
      if(b.kind === 'Initial') return 'Başlangıca geçiş giremez.';
      return '';

    case 'Binding': return K.every(k => ['Param','Value','Port'].includes(k)) ? '' : 'Binding parametre/value arasında olmalı.';
    case 'Import': return (a.kind === 'Package' || a.kind === 'Model') && (b.kind === 'Package' || b.kind === 'Model') ? '' : 'Import iki paket arasında olmalı.';
  }

}
function delModel(ids){

  const mv = (s, nx, ny) => { const a = geo.get(s.id), dx = nx - a.x, dy = ny - a.y; a.x = nx; a.y = ny; d.shapes.forEach(c => { if(c.parent === s.id){ const b = geo.get(c.id); b.x += dx; b.y += dy; } }); };

    case 'hc': sel.forEach(s => mv(s, cx - s.w / 2, s.y)); break;
    case 'top': sel.forEach(s => mv(s, s.x, y0)); break;
    case 'bottom': sel.forEach(s => mv(s, s.x, y1 - s.h)); break;

function wrap(s, maxW, bold, size){
  const out = [];
  String(s == null ? '' : s).split('\n').forEach(para => {
    let line = '';
    para.split(/\s+/).filter(Boolean).forEach(w => {
      const cand = line ? line + ' ' + w : w;
      if(tw(cand, bold, size) <= maxW){ line = cand; return; }
      if(line) out.push(line);
      line = '';
      if(tw(w, bold, size) <= maxW){ line = w; return; }
      let chunk = '';

    msgs.forEach((ed, i) => ed._num = i + 1);
    const maxY = msgs.reduce((m, ed) => Math.max(m, (ed.y || 0) + 30), 0);
    d.shapes.forEach(sh => { const e = E(sh.el); if(e && e.kind === 'Lifeline' && maxY > sh.y + sh.h - 20) sh.h = snapv(maxY - sh.y + 40); });
  }
  const cont = [], norm = [], ports = [];
  d.shapes.forEach(sh => {
    const e = E(sh.el); if(!e) return;
    const str = drawShape(sh, e, d, SM, exp);
    (CONT.has(e.kind) ? cont : ((e.kind === 'Port' || e.kind === 'Param') && sh.parent ? ports : norm)).push(str);
  });
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const grow = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  d.shapes.forEach(sh => {
    const e = E(sh.el); if(!e) return;
    grow(sh.x, sh.y); grow(sh.x + sh.w, sh.y + sh.h);
    if(e.kind === 'Port' || e.kind === 'Param'){ const L = tw(e.name + (e.type ? ' : ' + typeName(e.type) : ''), false, 11); grow(sh.x - L - 6, sh.y - 14); grow(sh.x + sh.w + L + 6, sh.y + sh.h + 14); }
    if(e.kind === 'Actor'){ grow(sh.x - 30, sh.y); grow(sh.x + sh.w + 30, sh.y + sh.h + 14); }
  });
  let edges = '';
  const rctx = routeCtx(d, SM);
  const ord = d.edges.slice().sort((a, b) => (edgeKind(a) === 'Anchor') - (edgeKind(b) === 'Anchor'));
  ord.forEach(ed => {
    const S = SM.get(ed.s), T2 = SM.get(ed.t); if(!S || !T2) return;
    if(ed.el && !E(ed.el)) return;
    const pts = edgeGeom(S, T2, ed, rctx); ed._pts = pts;

    const owner = E(d.owner);
    const label = d.dtype + ' [' + (owner ? (KIND[owner.kind].en || owner.kind) : '') + '] ' + (owner ? owner.name : '') + ' [' + d.name + ']';
    const fx = x0 - 30, fy = y0 - 50, fw = (x1 - x0) + 60, fh = (y1 - y0) + 80;
    const L = tw(label, false, 12) + 16;
    const FW = Math.max(fw, L + 30);
    frame = `<g class="frame"><rect x="${fx}" y="${fy}" width="${FW}" height="${fh}" fill="none" stroke="#555" stroke-width="1"/>` +
      `<path d="M${fx},${fy + 22} H${fx + L} L${fx + L + 10},${fy + 12} V${fy}" fill="none" stroke="#555" stroke-width="1"/>` +
      T(label, fx + 7, fy + 15, {anchor:'start', size:12}) + '</g>';
    bbox = {x:fx, y:fy, w:FW, h:fh};
  }
  return {svg:frame + cont.join('') + norm.join('') + ports.join('') + edges, bbox};
}

function copySel(){
  const d = cur(); if(!d) return false;
  const tops = d.shapes.filter(s => ST.sel.has(s.id) && !s.parent);
  if(!tops.length) return false;
  const set = new Set(tops.map(s => s.id));
  d.shapes.forEach(s => { if(s.parent && set.has(s.parent)) set.add(s.id); });
  const shapes = d.shapes.filter(s => set.has(s.id)).map(s => JSON.parse(JSON.stringify(s)));
  const edges = d.edges.filter(ed => set.has(ed.s) && set.has(ed.t) && !isMsg(edgeKind(ed))).map(ed => ({el:ed.el, kind:ed.kind, s:ed.s, t:ed.t, route:ed.route, stroke:ed.stroke}));
  ST.clip = {from:d.id, dtype:d.dtype, shapes, edges};
  toast(tops.length + ' şekil kopyalandı');
  return true;
}
function cloneSubtree(id, owner, map){
  const e = E(id); if(!e) return null;
  const c = JSON.parse(JSON.stringify(e));
  c.id = uid(); c.owner = owner;
  if(c.kind === 'Requirement'){ c.reqId = nextReqId(reqLevel(c)); }
  else if(c.name && !map.size) c.name = uniqName(c.name + ' kopya', owner);
  M.els[c.id] = c; map.set(id, c.id);
  kidsOf(id).filter(k => k.kind !== 'Diagram' && !KIND[k.kind].rel && k.id !== c.id).forEach(k => cloneSubtree(k.id, c.id, map));
  return c;
}
function pasteClip(forceCopy){
  const d = cur(), C = ST.clip; if(!d || !C) return toast('Pano boş');
  const tops = C.shapes.filter(s => !s.parent);
  const present = tops.some(s => d.shapes.some(x => x.el === s.el && !x.parent));
  const copy = forceCopy || present;
  const minX = Math.min(...tops.map(s => s.x)), minY = Math.min(...tops.map(s => s.y));
  let ox, oy;
  if(ST.mouse && !forceCopy && C.from !== d.id){ ox = snapv(ST.mouse.x) - minX; oy = snapv(ST.mouse.y) - minY; }
  else { ox = 30; oy = 30; }
  snap();
  const emap = new Map(), smap = new Map(), skipped = [];
  if(copy){
    tops.forEach(s => {
      const e = E(s.el); if(!e) return;
      if(!canDrop(d, e)){ skipped.push(e); return; }
      const owner = e.kind === 'Requirement' ? e.owner : (E(e.owner) ? e.owner : ownerFor(e.kind, d));
      const m1 = new Map(); cloneSubtree(e.id, owner, m1); m1.forEach((v, k) => emap.set(k, v));
    });
  }
  C.shapes.forEach(s => {
    const parentNew = s.parent ? smap.get(s.parent) : null;
    if(s.parent && !parentNew) return;
    let el = s.el;
    if(copy) el = emap.get(s.el) || (s.parent ? s.el : null);
    if(!el || !E(el)) return;
    if(!s.parent && !canDrop(d, E(el))) return;
    const n = Object.assign(JSON.parse(JSON.stringify(s)), {id:uid(), el, x:s.x + ox, y:s.y + oy});
    if(parentNew) n.parent = parentNew; else delete n.parent;
    d.shapes.push(n); smap.set(s.id, n.id);
  });
  C.edges.forEach(ed => {
    const S = smap.get(ed.s), T0 = smap.get(ed.t); if(!S || !T0) return;
    let el = ed.el;
    if(el && copy){
      const r = E(el); if(!r) return;
      const src = emap.get(r.src) || r.src, tgt = emap.get(r.tgt) || r.tgt;
      if(src === r.src && tgt === r.tgt) return;
      const nr = Object.assign(JSON.parse(JSON.stringify(r)), {id:uid(), src, tgt});
      if(nr.sp) nr.sp = emap.get(nr.sp) || nr.sp; if(nr.tp) nr.tp = emap.get(nr.tp) || nr.tp;
      if(nr.part){ delete nr.part; }
      M.els[nr.id] = nr; el = nr.id;
    }
    if(el && d.edges.some(x => x.el === el)) return;
    d.edges.push({id:uid(), el:el || null, kind:ed.kind, s:S, t:T0, route:ed.route, stroke:ed.stroke});
  });
  d.shapes.filter(s => [...smap.values()].includes(s.id)).forEach(s => autoEdges(d, s));
  ST.sel = new Set([...smap.values()].filter(id => { const s = shapeOf(d, id); return s && !s.parent; }));
  afterChange();
  toast((copy ? 'Yeni eleman olarak yapıştırıldı' : 'Mevcut elemanlar bu diyagramda gösterildi') + (skipped.length ? ` · ${skipped.length} eleman bu diyagram türüne uygun değil` : ''));
}

  };

  box.onclick = ev => { const it = ev.target.closest('[data-sr]'); if(it) go(res[+it.dataset.sr]); };
  draw();
}

/* ---- ağaçta çoklu seçim ve toplu sürükleme ---- */
function dropMany(ids, p, target){
  const d = cur(); if(!d) return;
  const ok = ids.map(E).filter(e => e && canDrop(d, e) && !d.shapes.some(s => s.el === e.id && !s.parent));
  if(!ok.length) return toast('Seçili elemanlar bu diyagrama eklenemiyor veya zaten var');
  snap(); ST.batch = true;
  const added = [];
  try {
    const cols = Math.ceil(Math.sqrt(ok.length));
    ok.forEach((e, i) => { dropExisting(e.id, {x:p.x + (i % cols) * 230, y:p.y + Math.floor(i / cols) * 150}, null); ST.sel.forEach(x => added.push(x)); });
  } finally { ST.batch = false; }
  ST.sel = new Set(added); afterChange();
  toast(ok.length + ' eleman eklendi; aralarındaki ilişkiler otomatik çizildi');
}

/* ---- bağlantı ucunu yeniden bağlama ---- */
function reconnectEdge(d, ed, end, tsh){
  const keepSh = shapeOf(d, end === 's' ? ed.t : ed.s);
  const S = end === 's' ? tsh : keepSh, T0 = end === 's' ? keepSh : tsh;
  if(!S || !T0 || (end === 's' ? ed.s : ed.t) === tsh.id) return;
  const kind = edgeKind(ed), a = E(S.el), b = E(T0.el);
  const err = validate(kind, a, b, d); if(err) return toast(err);
  snap();
  ed[end] = tsh.id; delete ed.mx; delete ed.my;
  if(ed.el){
    const r = E(ed.el);
    if(end === 's') r.src = a.id; else r.tgt = b.id;
    if(kind === 'Connector' || kind === 'Binding'){ const ps = S.parent && shapeOf(d, S.parent), pt = T0.parent && shapeOf(d, T0.parent); r.sp = ps ? ps.el : null; r.tp = pt ? pt.el : null; }
    if(r.part && E(r.part)){ const p = E(r.part); if(end === 't'){ p.type = b.id; } else { p.owner = a.id; } }
    Object.values(M.els).forEach(dd => {
      if(dd.kind !== 'Diagram' || dd === d) return;
      const before = dd.edges.length;
      dd.edges = dd.edges.filter(x => x.el !== r.id);
      if(dd.edges.length !== before || dd.shapes.some(s => s.el === r.src || s.el === r.tgt)) dd.shapes.filter(s => s.el === r.src || s.el === r.tgt).forEach(s => autoEdges(dd, s));
    });
  }
  afterChange(); toast('Bağlantı yeniden bağlandı');
}

/* ================= INLINE EDIT ================= */
const inl = $('#inl');
let inlDone = null;
function inlineEdit(sx, sy, w, h, val, multi, cb){
  const d = cur();
  inl.style.left = (d.vx + sx * d.z) + 'px'; inl.style.top = (d.vy + sy * d.z) + 'px';
  inl.style.width = Math.max(120, w * d.z) + 'px'; inl.style.height = Math.max(26, h * d.z) + 'px';
  inl.style.textAlign = multi ? 'left' : 'center';
  inl.value = val || ''; inl.style.display = 'block'; inl.focus(); inl.select();
  let done = false;
  inlDone = ok => { if(done) return; done = true; inl.style.display = 'none'; inlDone = null; if(ok && inl.value !== (val || '')) cb(inl.value); };
  inl.onkeydown = ev => {
    ev.stopPropagation();
    if(ev.key === 'Escape') inlDone(false);
    if(ev.key === 'Enter' && (!multi || ev.ctrlKey)){ ev.preventDefault(); inlDone(true); }
  };
  inl.onblur = () => inlDone && inlDone(true);
}
function editShape(sh){
  const e = E(sh.el); if(!e) return;
  const multi = e.kind === 'Comment';
  let y = sh.y, h = sh.h;
  if(e.kind === 'Actor'){ y = sh.y + sh.h - 22; h = 26; }
  else if(e.kind === 'Port' || e.kind === 'Param' || DIA.has(e.kind)){ y = sh.y - 28; h = 26; }
  else if(e.kind === 'Lifeline'){ h = 40; }
  else if(['Block','Subject','Partition','Package','Requirement','ConstraintBlock','State','TestCase','ConstraintProp'].includes(e.kind)){ y = sh.y + 18; h = 28; }
  else if(!multi) { y = sh.y + sh.h / 2 - 15; h = 30; }
  const x = e.kind === 'Port' || e.kind === 'Param' || DIA.has(e.kind) ? sh.x - 50 : (e.kind === 'Actor' ? sh.x - 30 : sh.x);
  const w = e.kind === 'Port' || e.kind === 'Param' || DIA.has(e.kind) ? 120 : (e.kind === 'Actor' ? sh.w + 60 : sh.w);
  inlineEdit(x, y, w, h, e.name, multi, v => { snap(); e.name = multi ? v : v.trim(); afterChange(); });
}
function editEdge(ed, field){
  const r = E(ed.el); if(!r) return;
  if(!ed._pts) renderDiagram();
  if(!ed._pts) return;
  const p = ed._pts, a = p.length === 4 ? p[1] : p[0], b = p.length === 4 ? p[2] : p[1];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  inlineEdit(mx - 70, my - 14, 140, 26, r[field] || '', false, v => { snap(); r[field] = v.trim(); afterChange(); });
}

async function inflateRaw(u8){

}

}
function parseCSV(text){

  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(q){ if(ch === '"'){ if(text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += ch; continue; }
    if(ch === '"'){ q = true; continue; }
    if(ch === delim){ row.push(f); f = ''; continue; }
    if(ch === '\n' || ch === '\r'){ if(ch === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; continue; }
    f += ch;
  }

const STATUS_COL = {'Taslak':'#7f8c8d', 'İncelemede':'#d18a00', 'Onaylı':'#2e7d32', 'Değişiklikte':'#c0392b', 'İptal':'#95a5a6'};
const reqStatus = r => REQ_STATUS.includes(r.status) ? r.status : 'Taslak';
const activeReq = r => reqStatus(r) !== 'İptal';
VIEWS['@quality'] = {tr:'Gereksinim Kalite Raporu', ic:'QA', note:'Gereksinim metinleri INCOSE yazım kurallarına göre denetlenir: zorunluluk ifadesi, belirsiz kelimeler, birden fazla ister, birimsiz değerler, TBD, aşırı uzunluk ve çok benzer gereksinimler.<br><br>Satıra tıklayınca gereksinim Özellikler panelinde açılır.'};

/* ---- kalite denetimi ---- */
const VAGUE = ['uygun', 'yeterli', 'yeterince', 'mümkün', 'mümkünse', 'mümkün olduğunca', 'mümkün mertebe', 'gerektiğinde', 'gerekirse', 'gerekli görüldüğünde', 'kolay', 'kolayca', 'kolaylıkla', 'hızlı', 'hızlıca', 'çabuk', 'kullanıcı dostu', 'esnek', 'sağlam', 'optimum', 'optimal', 'maksimize', 'minimize', 'en iyi', 'en az düzeyde', 'vb.', 'vs.', 've/veya', 'yaklaşık', 'makul', 'etkin', 'verimli', 'kabul edilebilir', 'normal', 'genellikle', 'bazen', 'çoğunlukla', 'yüksek performans', 'gibi', 'benzeri', 'adequate', 'appropriate', 'etc.', 'and/or', 'user-friendly', 'as possible', 'easy', 'fast', 'approximately', 'sufficient', 'flexible', 'robust'];
const UNITS = 'v|mv|kv|a|ma|w|kw|mw|hz|khz|mhz|ghz|s|sn|ms|µs|us|dk|min|saat|sa|h|gün|m|mm|cm|km|µm|nm|kg|g|mg|ton|n|kn|nm|pa|kpa|mpa|bar|mbar|psi|°c|°|c|k|db|dbm|db\\(a\\)|%|rpm|dev/dk|lux|lm|cd|l|ml|m2|m²|m3|m³|bit|byte|kb|mb|gb|tb|bps|kbps|mbps|gbps|grms|g²/hz|g2/hz|ohm|Ω|kΩ|f|µf|nf|pf|j|kj|wh|kwh|mah|ah|kn·m|n·m|nm|m/s|km/h|kt|knot|ft|in|lb|°f|mil|adet|kez|cycle|döngü|yıl|ay|hafta|saniye|dakika|metre|kilogram|volt|amper|watt|derece';
const UNIT_RE = (() => { const u = UNITS.split('|'), lg = u.filter(x => x.replace(/\\/g, '').length >= 4), sh = u.filter(x => x.replace(/\\/g, '').length < 4); return new RegExp('^\\s*((' + lg.join('|') + ')|(' + sh.join('|') + ')(?![a-zçğıöşü]))', 'i'); })();
function qTokens(t){ return new Set(asciiTr(t).replace(/[^a-z0-9 ]/g, ' ').split(' ').filter(w => w.length > 2)); }
let qCache = {sig:'', sim:new Map()};
function simIndex(){
  const rs = allReqs().filter(r => r.text && activeReq(r));
  const sig = rs.map(r => r.id + ':' + r.text).join('|');
  if(sig === qCache.sig) return qCache.sim;
  const tok = rs.map(r => [r, qTokens(r.text)]), sim = new Map();
  for(let i = 0; i < tok.length; i++) for(let j = i + 1; j < tok.length; j++){
    const A = tok[i][1], B = tok[j][1]; if(A.size < 3 || B.size < 3) continue;
    let inter = 0; A.forEach(w => { if(B.has(w)) inter++; });
    const jac = inter / (A.size + B.size - inter);
    if(jac >= 0.72){ [[i, j], [j, i]].forEach(([a, b]) => { const k = tok[a][0].id; if(!sim.has(k)) sim.set(k, []); sim.get(k).push([tok[b][0], jac]); }); }
  }
  qCache = {sig, sim}; return sim;
}
function reqQuality(r, sim){
  const out = [], t = String(r.text || '').trim(), low = t.toLocaleLowerCase('tr');
  if(!t){ out.push(['hata', 'Gereksinim metni boş']); return out; }
  const modal = low.match(/m[ae]l[ıi](d[ıi]r)?(?![a-zçğıöşü])|zorundadır|zorunludur|\bshall\b|\bmust\b/g) || [];
  if(!modal.length) out.push(['uyarı', 'Zorunluluk ifadesi yok ("-malıdır / -melidir")']);
  if(modal.length > 1) out.push(['uyarı', 'Birden fazla ister içeriyor olabilir (' + modal.length + ' zorunluluk ifadesi) — bölmeyi düşünün']);
  const vg = VAGUE.filter(v => new RegExp('(^|[^a-zçğıöşü])' + v.replace(/[.*+?^${}()|[\]\\\/]/g, '\\$&') + '($|[^a-zçğıöşü])', 'i').test(low));
  if(vg.length) out.push(['uyarı', 'Belirsiz / doğrulanamaz ifade: ' + vg.map(v => '"' + v + '"').join(', ')]);
  if(/\b(tbd|tbr|tbc)\b|belirlenecek|daha sonra belirlenecek|ileride tanımlanacak|\?\?/i.test(t)) out.push(['uyarı', 'Belirlenmemiş değer (TBD / belirlenecek)']);
  const nums = [];
  t.replace(/(^|[^A-Za-z0-9\-\/.])(\d+(?:[.,]\d+)?)(?![\d.,]*[A-Za-z]*-)/g, (m, pre, n, off) => {
    const rest = t.slice(off + m.length), before = t.slice(Math.max(0, off - 14), off + pre.length).toLocaleLowerCase('tr');
    if(/^[\-\/]/.test(rest) || /^\.\d/.test(rest) || pre === '%' || /%\s*$/.test(before)) return m;
    if(/(yöntem|method|madde|bölüm|kısım|rev|std|standart|no|sayı|sürüm|versiyon|tablo|şekil|ek|annex|para)\.?\s*$/.test(before)) return m;
    if(!UNIT_RE.test(rest) && !/^\s*(x|×|\*)\s*\d/.test(rest)) nums.push(n);
    return m;
  });
  const realNums = nums.filter(n => !/^(19|20)\d\d$/.test(n));
  if(realNums.length) out.push(['bilgi', 'Birimsiz sayısal değer: ' + [...new Set(realNums)].slice(0, 4).join(', ')]);
  const words = t.split(/\s+/).length;
  if(words > 55) out.push(['bilgi', 'Çok uzun (' + words + ' kelime) — sadeleştirmeyi düşünün']);
  if(/\b(o|bu|şu|it|they|this)\b\s/i.test(t.split(/[.;]/)[0]) && false) out.push(['bilgi', 'Belirsiz zamir']);
  const dup = allReqs().filter(x => x !== r && x.reqId && x.reqId === r.reqId);
  if(dup.length) out.push(['hata', 'Aynı ID başka bir gereksinimde de var: ' + r.reqId]);
  (sim && sim.get(r.id) || []).slice(0, 3).forEach(([o, j]) => out.push(['uyarı', `${o.reqId || nm(o)} ile çok benzer (%${Math.round(j * 100)})`]));
  return out;
}
function qualityBadge(iss){
  if(!iss.length) return '<span class="qok" title="Sorun bulunmadı">✓</span>';
  const sev = iss.some(x => x[0] === 'hata') ? 'qerr' : iss.some(x => x[0] === 'uyarı') ? 'qwarn' : 'qinfo';
  return `<span class="${sev}" title="${esc(iss.map(x => '• ' + x[1]).join('\n'))}">⚠ ${iss.length}</span>`;
}
function qualityHTML(){
  const sim = simIndex(), rs = allReqs().filter(activeReq);
  if(!rs.length) return '<div class="vempty">Denetlenecek gereksinim yok.</div>';
  const rows = rs.map(r => ({r, iss:reqQuality(r, sim)}));
  const bad = rows.filter(x => x.iss.length), cnt = s => rows.reduce((n, x) => n + x.iss.filter(i => i[0] === s).length, 0);
  let h = `<div class="cards"><div class="card"><div class="cv">${rs.length}</div><div class="ct">Denetlenen gereksinim</div></div>
    <div class="card"><div class="cv" style="color:${bad.length ? '#c0392b' : '#2e9e6a'}">${bad.length}</div><div class="ct">Sorunlu gereksinim</div></div>
    <div class="card"><div class="cv" style="color:#a52834">${cnt('hata')}</div><div class="ct">Hata</div></div>
    <div class="card"><div class="cv" style="color:#d18a00">${cnt('uyarı')}</div><div class="ct">Uyarı</div></div>
    <div class="card"><div class="cv" style="color:#2e86c1">${cnt('bilgi')}</div><div class="ct">Bilgi</div></div></div>`;
  const list = CV.qall ? rows : bad;
  h += `<table class="rt cvt"><thead><tr><th>ID</th><th>Gereksinim metni</th><th>Durum</th><th>Bulgular</th></tr></thead><tbody>`;
  list.forEach(({r, iss}) => {
    h += `<tr data-row="${r.id}" class="${ST.tsel === r.id ? 'sel' : ''}"><td style="white-space:nowrap"><a class="lnk" data-goto="${r.id}"><b>${esc(r.reqId || '')}</b></a></td><td class="cvtx" style="max-width:520px">${esc(r.text || '')}</td><td>${statusChip(r)}</td><td class="gapt">${iss.length ? iss.map(([s, m]) => `<span class="q-${s}">${s === 'hata' ? '✖' : s === 'uyarı' ? '⚠' : 'ℹ'} ${esc(m)}</span>`).join('<br>') : '<span class="qok">✓ Sorun yok</span>'}</td></tr>`;
  });
  return h + `</tbody></table>${!list.length ? '<div class="vempty">Tüm gereksinimler kurallara uygun 🎉</div>' : ''}`;
}
function statusChip(r){ const s = reqStatus(r); return `<span class="stc" style="background:${STATUS_COL[s]}">${esc(s)}</span>`; }

/* ---- değişiklik geçmişi ---- */
function userName(){ try { return localStorage.getItem('sysml-user') || 'Kullanıcı'; } catch(e){ return 'Kullanıcı'; } }
function setUserName(){
  const v = prompt('Değişiklik geçmişinde görünecek adınız:', userName());
  if(v != null && v.trim()){ try { localStorage.setItem('sysml-user', v.trim()); } catch(e){} toast('Kullanıcı adı: ' + v.trim()); }
}
const TRACKED = [['reqId', 'ID'], ['name', 'Başlık'], ['text', 'Metin'], ['level', 'Seviye'], ['subsys', 'Alt sistem'], ['verif', 'Doğrulama'], ['status', 'Durum'], ['srcNo', 'Müşteri ister no'], ['srcText', 'Müşteri isteri']];
const SUBST = new Set(['text', 'verif', 'level', 'subsys', 'name']);
let REQ_CACHE = null;
function reqSnap(r, idx){
  const o = {};
  TRACKED.forEach(([k]) => o[k] = k === 'status' ? reqStatus(r) : String(r[k] == null ? '' : r[k]));
  Object.entries(r.attrs || {}).forEach(([k, v]) => o['attr:' + k] = String(v == null ? '' : v));
  o._parents = (idx['DeriveReqt'] || []).filter(x => x.src === r.id).map(x => E(x.tgt)).filter(Boolean).map(x => x.reqId).sort().join(', ');
  return o;
}
function rebuildReqCache(){ const idx = relIdx(); REQ_CACHE = new Map(allReqs().map(r => [r.id, reqSnap(r, idx)])); }
function fieldLabel(k){ if(k === '_parents') return 'Üst gereksinim'; if(k.startsWith('attr:')){ const a = reqCfg().attrs.find(x => x.key === k.slice(5)); return a ? a.label : k.slice(5); } const t = TRACKED.find(x => x[0] === k); return t ? t[1] : k; }
function trackReqChanges(){
  if(!M) return;
  if(!REQ_CACHE){ rebuildReqCache(); return; }
  const idx = relIdx(), now = new Date().toISOString(), u = userName(), why = ST.reason || '';
  const log = M.reqLog = M.reqLog || [];
  const seen = new Set(), push = e => log.push(Object.assign({t:now, u, why}, e));
  allReqs().forEach(r => {
    seen.add(r.id);
    let cur0 = reqSnap(r, idx); const old = REQ_CACHE.get(r.id);
    if(!old){ push({id:r.id, rid:r.reqId, f:'Oluşturuldu', o:'', n:(r.text || r.name || '').slice(0, 200)}); return; }
    const keys = new Set(Object.keys(old).concat(Object.keys(cur0)));
    let subst = false;
    keys.forEach(k => { const a = old[k] || '', b = cur0[k] || ''; if(a !== b){ push({id:r.id, rid:r.reqId, f:fieldLabel(k), o:a, n:b}); if(SUBST.has(k)) subst = true; } });
    if(subst && old.status === 'Onaylı' && reqStatus(r) === 'Onaylı'){
      r.status = 'Değişiklikte'; push({id:r.id, rid:r.reqId, f:'Durum', o:'Onaylı', n:'Değişiklikte', why:(why ? why + ' · ' : '') + 'onaylı gereksinim değiştiği için otomatik'});
      toast(`${r.reqId}: onaylı gereksinim değişti → durum "Değişiklikte" yapıldı`);
    }
  });
  REQ_CACHE.forEach((old, id) => { if(!seen.has(id)) push({id, rid:old.reqId, f:'Silindi', o:(old.text || '').slice(0, 200), n:''}); });
  if(log.length > 5000) log.splice(0, log.length - 5000);
  rebuildReqCache();
}

      all.filter(e => !rid || e.id === rid).forEach(e => rows.push([new Date(e.t).toLocaleString('tr-TR'), e.u, {v:e.rid || '', s:6}, e.f, e.o, e.n, e.why || '']));
      download(buildXlsx([{name:'Değişiklik Geçmişi', rows, widths:[20, 16, 12, 18, 50, 50, 30], header:true, freeze:[0, 1], filter:1}]), fileSafe(E(M.rootId).name) + ' - Değişiklik Geçmişi.xlsx');

/* kelime düzeyinde fark */
function wordDiff(a, b){
  const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/);
  if(A.length * B.length > 250000) return `<del>${esc(a)}</del> <ins>${esc(b)}</ins>`;
  const n = A.length, m = B.length, L = Array.from({length:n + 1}, () => new Uint16Array(m + 1));
  for(let i = n - 1; i >= 0; i--) for(let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  let i = 0, j = 0, out = '';
  while(i < n && j < m){
    if(A[i] === B[j]){ out += esc(A[i]); i++; j++; }
    else if(L[i + 1][j] >= L[i][j + 1]){ out += `<del>${esc(A[i])}</del>`; i++; }
    else { out += `<ins>${esc(B[j])}</ins>`; j++; }
  }
  while(i < n){ out += `<del>${esc(A[i++])}</del>`; }
  while(j < m){ out += `<ins>${esc(B[j++])}</ins>`; }
  return out.replace(/<\/del><del>/g, '').replace(/<\/ins><ins>/g, '');
}

/* ---- taban çizgileri ---- */
let BL = {a:'', b:'@current', onlyCh:true};
function baselineSnapshot(){
  const idx = relIdx(), out = {};
  allReqs().forEach(r => { const t = trace(r, idx); out[r.id] = Object.assign(reqSnap(r, idx), {_satisfy:t.elems.map(x => x.name).sort().join(', '), _funcs:t.funcs.map(x => x.name).sort().join(', '), _tests:t.verifyBy.map(x => x.name).sort().join(', ')}); });
  return out;
}
function createBaseline(){
  const name = prompt('Taban çizgisi adı (ör. SRR öncesi, Rev-A):', 'Taban çizgisi ' + ((M.baselines || []).length + 1));
  if(!name || !name.trim()) return;
  snap();
  M.baselines = M.baselines || [];
  M.baselines.push({id:uid(), name:name.trim(), t:new Date().toISOString(), u:userName(), reqs:baselineSnapshot()});
  BL.a = M.baselines[M.baselines.length - 1].id; BL.b = '@current';
  afterChange(); toast(`"${name.trim()}" taban çizgisi oluşturuldu (${Object.keys(M.baselines[M.baselines.length - 1].reqs).length} gereksinim)`);
}
const blSet = id => id === '@current' ? baselineSnapshot() : ((M.baselines || []).find(b => b.id === id) || {}).reqs || {};
const blName = id => id === '@current' ? 'Güncel model' : ((M.baselines || []).find(b => b.id === id) || {}).name || '?';
function baselineDiff(aId, bId){
  const A = blSet(aId), B = blSet(bId), rows = [];
  const ids = new Set(Object.keys(A).concat(Object.keys(B)));
  ids.forEach(id => {
    const a = A[id], b = B[id];
    if(!a){ rows.push({id, rid:b.reqId, st:'Eklendi', ch:[], a, b}); return; }
    if(!b){ rows.push({id, rid:a.reqId, st:'Silindi', ch:[], a, b}); return; }
    const ch = [...new Set(Object.keys(a).concat(Object.keys(b)))].filter(k => (a[k] || '') !== (b[k] || ''));
    rows.push({id, rid:b.reqId || a.reqId, st:ch.length ? 'Değişti' : 'Aynı', ch, a, b});
  });
  return rows.sort((x, y) => String(x.rid).localeCompare(String(y.rid), 'tr', {numeric:true}));
}
const blField = k => k === '_satisfy' ? 'Karşılayan elemanlar' : k === '_funcs' ? 'Fonksiyonlar' : k === '_tests' ? 'Doğrulayan testler' : fieldLabel(k);
function baselineHTML(){
  const bls = M.baselines || [];
  let h = `<div class="bll">${bls.length ? bls.map(b => `<div class="blc"><b>${esc(b.name)}</b><span class="muted">${esc(new Date(b.t).toLocaleString('tr-TR'))} · ${esc(b.u || '')} · ${Object.keys(b.reqs).length} gereksinim</span><button class="tdel" data-bldel="${b.id}" title="Sil">✕</button></div>`).join('') : '<div class="muted">Henüz taban çizgisi yok. "+ Taban çizgisi oluştur" ile mevcut gereksinim setinin anlık kopyasını alın.</div>'}</div>`;
  if(!bls.length) return h;
  if(!BL.a || !bls.some(b => b.id === BL.a)) BL.a = bls[bls.length - 1].id;
  const rows = baselineDiff(BL.a, BL.b), sum = st => rows.filter(r => r.st === st).length;
  h += `<div class="cards"><div class="card"><div class="cv" style="color:#2e7d32">${sum('Eklendi')}</div><div class="ct">Eklenen</div></div><div class="card"><div class="cv" style="color:#c0392b">${sum('Silindi')}</div><div class="ct">Silinen</div></div><div class="card"><div class="cv" style="color:#d18a00">${sum('Değişti')}</div><div class="ct">Değişen</div></div><div class="card"><div class="cv">${sum('Aynı')}</div><div class="ct">Değişmeyen</div></div></div>`;
  const list = BL.onlyCh ? rows.filter(r => r.st !== 'Aynı') : rows;
  h += `<table class="rt cvt"><thead><tr><th>ID</th><th>Durum</th><th>Alan</th><th>${esc(blName(BL.a))}</th><th>${esc(blName(BL.b))}</th></tr></thead><tbody>`;
  list.forEach(r => {
    const cls = {Eklendi:'d-add', Silindi:'d-del', 'Değişti':'d-chg', 'Aynı':''}[r.st];
    if(r.st === 'Değişti'){
      r.ch.forEach((k, i) => { h += `<tr class="${cls}">${i === 0 ? `<td rowspan="${r.ch.length}" style="white-space:nowrap"><a class="lnk" data-goto="${r.id}"><b>${esc(r.rid || '')}</b></a></td><td rowspan="${r.ch.length}"><span class="dchip ${cls}">${r.st}</span></td>` : ''}<td>${esc(blField(k))}</td><td class="muted" style="max-width:380px">${esc(r.a[k] || '')}</td><td style="max-width:380px">${wordDiff(r.a[k], r.b[k])}</td></tr>`; });

function impactLinks(x){
  const idx = relIdx(), out = [], g = k => idx[k] || [];
  const e = E(x); if(!e) return out;
  g('DeriveReqt').forEach(r => { if(r.tgt === x) out.push([r.src, 'türetilmiş alt gereksinim']); });
  g('Satisfy').forEach(r => { if(r.tgt === x) out.push([r.src, FUNC_KINDS.has((E(r.src) || {}).kind) ? 'karşılayan fonksiyon' : 'karşılayan eleman']); if(r.src === x) out.push([r.tgt, 'karşıladığı gereksinim (yeniden doğrulanmalı)']); });
  g('Verify').forEach(r => { if(r.tgt === x) out.push([r.src, 'doğrulayan test (tekrar edilmeli)']); if(r.src === x) out.push([r.tgt, 'doğruladığı gereksinim']); });
  g('Refine').concat(g('Trace')).forEach(r => { if(r.tgt === x) out.push([r.src, r.kind.toLowerCase()]); else if(r.src === x) out.push([r.tgt, r.kind.toLowerCase()]); });
  g('Allocate').forEach(r => { if(r.src === x) out.push([r.tgt, 'tahsis edildiği yapı']); if(r.tgt === x) out.push([r.src, 'tahsis edilen fonksiyon']); });
  if(e.kind === 'Block' || e.kind === 'ConstraintBlock') Object.values(M.els).forEach(p => { if((p.kind === 'Part' || p.kind === 'ConstraintProp' || p.kind === 'Lifeline') && p.type === x){ const o = E(p.owner); out.push([p.id, 'bu tipte ' + KIND[p.kind].tr.toLowerCase()]); if(o && o.kind === 'Block') out.push([o.id, 'içeren blok']); } });
  if(e.kind === 'Activity') Object.values(M.els).forEach(a => { if(a.kind === 'Action' && a.behavior === x) out.push([a.id, 'çağıran aksiyon']); });
  if(e.kind === 'Part' && e.type) out.push([e.type, 'tip bloğu']);
  return out.filter(([id]) => E(id) && id !== x);
}
function impactUp(x){
  const idx = relIdx(), out = [], g = k => idx[k] || [];
  g('DeriveReqt').forEach(r => { if(r.src === x) out.push([r.tgt, 'türetildiği üst gereksinim']); });

}
function impactTree(root, fn, maxD){
  const seen = new Set([root]), lines = [];
  const rec = (x, d) => { if(d > maxD) return; fn(x).forEach(([y, why]) => { const rep = seen.has(y); seen.add(y); lines.push({id:y, d, why, rep}); if(!rep) rec(y, d + 1); }); };
  rec(root, 1);
  return {lines, ids:seen};
}

let CP = {grp:'tLevel', res:'all', q:'', scale:'auto'};
function campaignTests(){
  const q = asciiTr(CP.q || '');
  return allTests().filter(tc => (CP.res === 'all' || (CP.res === '@late' ? overdue(tc) : testResult(tc) === CP.res)) && (!q || asciiTr([tc.name, tc.procNo, tc.testItem, tc.std, tc.resp, tc.reportNo].join(' ')).includes(q)));

function ganttSVG(tests){
  const dated = tests.filter(t => t.pStart && !isNaN(Date.parse(t.pStart)));
  if(!dated.length) return `<div class="untr" style="margin-bottom:12px">Zaman çizelgesi için testlere <b>planlanan başlangıç</b> ve <b>bitiş</b> tarihi girin (aşağıdaki tablodan veya Özellikler panelinden).</div>`;
  const DAY = 864e5, P = s => Date.parse(s + 'T00:00:00Z'), today = P(todayISO());
  let min = Infinity, max = -Infinity;
  dated.forEach(t => { const a = P(t.pStart), b = t.pEnd && !isNaN(P(t.pEnd)) ? Math.max(a, P(t.pEnd)) : a; min = Math.min(min, a); max = Math.max(max, b); if(t.rDate && !isNaN(P(t.rDate))){ min = Math.min(min, P(t.rDate)); max = Math.max(max, P(t.rDate)); } });
  if(today >= min - 45 * DAY && today <= max + 45 * DAY){ min = Math.min(min, today); max = Math.max(max, today); }
  min -= 3 * DAY; max += 4 * DAY;
  const days = Math.round((max - min) / DAY);
  const pxd = CP.scale === 'gun' ? 26 : CP.scale === 'hafta' ? 9 : CP.scale === 'ay' ? 3 : Math.max(3, Math.min(26, 980 / days));
  const LW = 270, RH = 26, HH = 42, W = LW + days * pxd + 10;
  const groups = []; const gk = t => CP.grp === 'none' ? '' : CP.grp === 'result' ? testResult(t) : (t[CP.grp] || '(belirtilmemiş)');
  const order = CP.grp === 'tLevel' ? TEST_LEVELS : CP.grp === 'result' ? TEST_RESULT : [];
  dated.forEach(t => { const k = gk(t); let g = groups.find(x => x.k === k); if(!g) groups.push(g = {k, items:[]}); g.items.push(t); });
  groups.sort((a, b) => { const ia = order.indexOf(a.k), ib = order.indexOf(b.k); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.k.localeCompare(b.k, 'tr'); });
  const nRows = dated.length + (CP.grp === 'none' ? 0 : groups.length), H = HH + nRows * RH + 6;
  const X = ms => LW + (ms - min) / DAY * pxd;
  let s = `<svg class="gantt" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/><rect x="0" y="0" width="${W}" height="${HH}" fill="#26364b"/>`;
  const AYLAR = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  for(let d = 0; d <= days; d++){
    const ms = min + d * DAY, dt = new Date(ms), x = X(ms), dom = dt.getUTCDate(), wd = dt.getUTCDay();

/* ================= BOOT ================= */
(async function boot(){
  if(NATIVE){
    document.querySelectorAll('.nat').forEach(b => b.style.display = 'inline-block');
    let info = {};
    try { info = await window.nativeInfo() || {}; } catch(e){}
    let m = null;
    if(info.argText) m = parseModelText(info.argText);
    if(m){ curPath = /\.(sysml|json)$/i.test(info.argPath || '') ? info.argPath : ''; dirty = !curPath; }
    else if(info.autosave){ m = parseModelText(info.autosave); if(m){ curPath = info.lastPath || ''; dirty = !!info.dirty || !curPath; } }
    if(!m){ m = demo(); dirty = true; }
    loadModel(m); renderAll(); updTitle(); persist();
    return;
  }
  let emb = null, ls = null;
  try { const t = $('#embedded-model').textContent.trim(); if(t) emb = JSON.parse(t); } catch(e){}
  try { const t = localStorage.getItem(LSK); if(t) ls = JSON.parse(t); } catch(e){}
  let m;
  if(validModel(emb) && validModel(ls) && ls.uid === emb.uid && (ls.savedAt || 0) > (emb.savedAt || 0)) m = ls;
  else if(validModel(emb)) m = emb;
  else if(validModel(ls)) m = ls;
  else m = demo();
  loadModel(m);
  renderAll(); persist();
})();
