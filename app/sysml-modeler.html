<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>SysML Modelleyici</title>
<style>
:root{--bg:#e9edf2;--panel:#f7f8fa;--line:#c8cfd9;--acc:#2d7ff9;--txt:#1e2733;--mut:#6b7686}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px "Segoe UI",Arial,sans-serif;color:var(--txt);background:var(--bg);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#toolbar{display:flex;align-items:center;gap:3px;padding:5px 8px;background:#26364b;color:#fff;flex-wrap:wrap}
#toolbar .brand{font-weight:600;margin-right:10px;letter-spacing:.3px}
#toolbar button{background:#34475f;color:#fff;border:1px solid #46607f;border-radius:4px;padding:4px 9px;font:inherit;cursor:pointer}
#toolbar button:hover{background:#41597a}
#toolbar .sep{width:1px;height:20px;background:#4b5f7a;margin:0 5px}
#toolbar #zoomLbl{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#main{flex:1;display:flex;min-height:0}
#left{width:300px;min-width:180px;display:flex;flex-direction:column;background:var(--panel)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:5px 8px;background:#dde3ea;border-bottom:1px solid var(--line);font-weight:600;font-size:12px;color:#334}
.ph button{border:1px solid var(--line);background:#fff;border-radius:3px;font-size:11px;padding:1px 6px;cursor:pointer}
#treeBox{flex:1.3;min-height:60px;overflow:auto;padding:3px 0;outline:none}
#hsplit{height:5px;cursor:row-resize;background:var(--line)}
#vsplit{width:5px;cursor:col-resize;background:var(--line)}
#propsBox{flex:1;min-height:60px;overflow:auto;display:flex;flex-direction:column}
#props{padding:8px;overflow:auto}
.tr{display:flex;align-items:center;gap:4px;padding:2px 6px 2px 0;white-space:nowrap;cursor:default;user-select:none}
.tr:hover{background:#e6edf7}
.tr.sel{background:#cfe0fb}
.tr.drop{outline:2px dashed var(--acc);outline-offset:-2px}
.tw{width:14px;text-align:center;color:#667;cursor:pointer;flex:none;font-size:10px}
.ic{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:16px;padding:0 3px;border-radius:3px;font-size:10px;font-weight:700;color:#fff;flex:none}
.nm{overflow:hidden;text-overflow:ellipsis}
.kd{color:var(--mut);font-size:11px;margin-left:4px}
.tr input{font:inherit;padding:0 3px;border:1px solid var(--acc);width:170px}
.grp{color:var(--mut);font-style:italic}
#palette{width:158px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;flex:none}
.pg{padding:6px 8px 2px;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.pi{display:flex;align-items:center;gap:7px;margin:1px 5px;padding:4px 6px;border-radius:4px;cursor:grab;user-select:none;border:1px solid transparent}
.pi:hover{background:#e3eaf4}
.pi.on{background:#cfe0fb;border-color:var(--acc)}
.pi svg{flex:none}
.pnote{padding:10px;color:var(--mut);font-size:12px;line-height:1.5}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#tabs{display:flex;gap:1px;background:#d5dbe3;border-bottom:1px solid var(--line);min-height:30px;overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 10px;background:#e8ecf1;cursor:pointer;white-space:nowrap;border-top:2px solid transparent}
.tab.cur{background:#fff;border-top-color:var(--acc)}
.tab .x{color:#889;padding:0 3px;border-radius:3px}
.tab .x:hover{background:#d8dde4;color:#c00}
.tab .ti{font-size:10px;font-weight:700;color:#fff;border-radius:3px;padding:1px 4px}
#canvasWrap{flex:1;position:relative;overflow:hidden;background:#fff}
#canvasWrap.tool #svg{cursor:crosshair}
#svg{width:100%;height:100%;display:block;user-select:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);text-align:center;line-height:1.7;pointer-events:none;padding:30px}
#inl{position:absolute;display:none;z-index:20;font:12px "Segoe UI",Arial,sans-serif;border:1.5px solid var(--acc);padding:3px 4px;resize:none;text-align:center;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#status{display:flex;gap:16px;padding:3px 10px;background:#dde3ea;border-top:1px solid var(--line);font-size:11.5px;color:#445}
#status .hint{margin-left:auto;color:var(--mut)}
#ctx{position:fixed;display:none;z-index:100;background:#fff;border:1px solid #b9c2ce;box-shadow:0 4px 16px rgba(0,0,0,.18);border-radius:5px;padding:4px 0;min-width:200px;max-height:80vh;overflow:auto}
#ctx .mi{padding:5px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:20px}
#ctx .mi:hover{background:#e3ecfa}
#ctx .mi.dis{color:#aaa;pointer-events:none}
#ctx .mh{padding:5px 12px 2px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--mut);letter-spacing:.4px}
#ctx .sep{height:1px;background:#e2e6eb;margin:4px 0}
#ctx .k{color:#99a;font-size:11px}
.pt{display:flex;align-items:center;gap:6px;font-weight:600;margin-bottom:8px;font-size:13px}
.pf{display:grid;grid-template-columns:82px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.pf label{color:#556;font-size:12px}
.pf input,.pf select,.pf textarea{font:inherit;font-size:12px;padding:3px 5px;border:1px solid #bfc8d3;border-radius:3px;width:100%;background:#fff}
.pf textarea{min-height:54px;resize:vertical}
.pf input[type=color]{padding:0;height:24px;width:48px}
.lnk{color:var(--acc);cursor:pointer;text-decoration:none}
.lnk:hover{text-decoration:underline}
.sub{margin:10px 0 4px;font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e2e6eb;padding-top:8px}
.sub button,.pbtn{border:1px solid #bfc8d3;background:#fff;border-radius:3px;font-size:11px;padding:2px 7px;cursor:pointer}
.li{padding:2px 0 2px 6px;font-size:12px}
.muted{color:var(--mut);font-size:12px}
#modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:200}
#modal .box{background:#fff;border-radius:8px;max-width:720px;max-height:85vh;overflow:auto;padding:18px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3);line-height:1.55}
#modal h2{margin:0 0 8px;font-size:17px}
#modal h3{margin:14px 0 4px;font-size:14px}
#modal table{border-collapse:collapse;font-size:12.5px}
#modal td{padding:2px 12px 2px 0;vertical-align:top}
#modal kbd{background:#eef1f5;border:1px solid #c8cfd9;border-radius:3px;padding:0 4px;font-size:11.5px}
.nat{display:none}
.icbar{display:flex;gap:8px;align-items:center;margin:6px 0 8px}
.icbar input{flex:1;font:inherit;padding:6px 9px;border:1px solid #bfc8d3;border-radius:5px}
.iccats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.chip{border:1px solid #cfd6df;background:#f5f7fa;border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip.on{background:#26364b;color:#fff;border-color:#26364b}
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;max-height:52vh;overflow:auto;padding:2px}
.icb{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px 7px;border:1px solid #e0e5eb;border-radius:7px;background:#fff;cursor:pointer;font:11px "Segoe UI",Arial,sans-serif;color:#334;line-height:1.2;text-align:center}
.icb:hover{border-color:var(--acc);background:#f0f6ff}
.icb.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(45,127,249,.35)}
.icprev{display:inline-flex;vertical-align:middle;margin-right:4px}
.icsw{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.icsw b{width:18px;height:18px;border-radius:50%;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #c8cfd9}
.icsw b.on{box-shadow:0 0 0 2px #26364b}
#toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:#26364b;color:#fff;padding:7px 14px;border-radius:5px;display:none;z-index:300;font-size:12.5px}
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <span class="brand">SysML Modelleyici</span>
    <button data-act="new" title="Yeni proje">Yeni</button>
    <button data-act="open" title="JSON veya gömülü HTML model dosyası aç">Aç</button>
    <button data-act="save" title="Modeli kaydet (Ctrl+S)">Kaydet</button>
    <button data-act="saveAs" class="nat" title="Farklı kaydet (Ctrl+Shift+S)">Farklı kaydet</button>
    <button data-act="saveHtml" title="Modeli içine gömülü HTML olarak kaydet (paylaşım için)">HTML olarak kaydet</button>
    <span class="sep"></span>
    <button data-act="navBack" title="Önceki diyagram (Alt+←)">◀</button>
    <button data-act="navFwd" title="Sonraki diyagram (Alt+→)">▶</button>
    <span class="sep"></span>
    <button data-act="undo" title="Geri al (Ctrl+Z)">↶ Geri</button>
    <button data-act="redo" title="Yinele (Ctrl+Y)">↷ İleri</button>
    <span class="sep"></span>
    <button data-act="png" title="Diyagramı PNG olarak indir">PNG</button>
    <button data-act="svg" title="Diyagramı SVG olarak indir">SVG</button>
    <button data-act="copy" title="Diyagramı panoya resim olarak kopyala">Panoya kopyala</button>
    <span class="sep"></span>
    <button data-act="zout" title="Uzaklaş">−</button>
    <span id="zoomLbl">100%</span>
    <button data-act="zin" title="Yakınlaş">+</button>
    <button data-act="fit" title="Diyagramı ekrana sığdır">Sığdır</button>
    <button data-act="grid" title="Izgara göster/gizle">Izgara</button>
    <span class="sep"></span>
    <button data-act="layoutMenu" title="Otomatik düzen ve hizalama (Ctrl+Shift+L)">Düzen ▾</button>
    <button data-act="iconMenu" title="Seçili blok/part/aktöre ikon ata">İkon</button>
    <span class="sep"></span>
    <button data-act="help">Yardım</button>
  </div>
  <div id="main">
    <div id="left">
      <div class="ph"><span>Model Ağacı</span><span><button data-act="expandAll" title="Tümünü aç">+</button> <button data-act="collapseAll" title="Tümünü kapat">−</button></span></div>
      <div id="treeBox" tabindex="0"><div id="tree"></div></div>
      <div id="hsplit"></div>
      <div id="propsBox"><div class="ph"><span>Özellikler</span></div><div id="props"></div></div>
    </div>
    <div id="vsplit"></div>
    <div id="palette"></div>
    <div id="center">
      <div id="tabs"></div>
      <div id="canvasWrap">
        <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="empty"></div>
        <textarea id="inl" rows="1"></textarea>
      </div>
    </div>
  </div>
  <div id="status"><span id="stDiag"></span><span id="stCount"></span><span class="hint" id="stHint"></span></div>
</div>
<div id="ctx"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<input type="file" id="fileIn" accept=".sysml,.json,.html,.htm" style="display:none">
<script type="application/json" id="embedded-model"></script>
<script>
'use strict';
const PRISTINE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
const LSK = 'sysml-modeler-v1';
const $ = s => document.querySelector(s);
const uid = () => '_' + Math.random().toString(36).slice(2, 9) + (Date.now() % 1e7).toString(36);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G = 10, FF = 'Segoe UI, Arial, sans-serif';
const STROKE = '#3a3a3a';

/* ================= META ================= */
const KIND = {
  Model:{tr:'Model',en:'Model',ic:'M',col:'#5b6b82'},
  Package:{tr:'Paket',en:'Package',ic:'P',col:'#b08a2e',w:180,h:110},
  Block:{tr:'Blok',en:'Block',ic:'B',col:'#3d7bd9',w:170,h:80},
  Part:{tr:'Part',ic:'pt',col:'#2e9e6a',w:170,h:80},
  Value:{tr:'Value Property',ic:'v',col:'#8a5cc2',w:150,h:36},
  Port:{tr:'Port',ic:'▫',col:'#d9772e',w:16,h:16},
  Actor:{tr:'Aktör',ic:'A',col:'#c2416b',w:60,h:90},
  UseCase:{tr:'Use Case',ic:'U',col:'#2e8fa3',w:150,h:70},
  Subject:{tr:'Sistem Sınırı',ic:'S',col:'#5f6b7a',w:320,h:380},
  Activity:{tr:'Aktivite',en:'Activity',ic:'Ac',col:'#7a4fbf'},
  Action:{tr:'Aksiyon',ic:'a',col:'#7a4fbf',w:140,h:50},
  Initial:{tr:'Başlangıç Düğümü',ic:'●',col:'#333',w:24,h:24},
  Final:{tr:'Aktivite Sonu',ic:'◉',col:'#333',w:26,h:26},
  FlowFinal:{tr:'Akış Sonu',ic:'⊗',col:'#333',w:24,h:24},
  Decision:{tr:'Karar',ic:'◇',col:'#555',w:36,h:36},
  Merge:{tr:'Birleştirme',ic:'◇',col:'#555',w:36,h:36},
  Fork:{tr:'Çatallanma (Fork)',ic:'▬',col:'#222',w:120,h:6},
  Join:{tr:'Eşzamanlama (Join)',ic:'▬',col:'#222',w:120,h:6},
  Object:{tr:'Nesne Düğümü',ic:'O',col:'#4f7f9e',w:130,h:44},
  Partition:{tr:'Kulvar',ic:'║',col:'#6c7a89',w:250,h:480},
  Comment:{tr:'Not',ic:'✎',col:'#a89a3a',w:170,h:60},
  Diagram:{tr:'Diyagram',ic:'D',col:'#445'},
  Association:{tr:'Association',rel:1},
  Composition:{tr:'Composition',rel:1},
  Aggregation:{tr:'Aggregation',rel:1},
  Generalization:{tr:'Generalization',rel:1},
  Dependency:{tr:'Dependency',rel:1},
  Include:{tr:'Include',rel:1},
  Extend:{tr:'Extend',rel:1},
  ControlFlow:{tr:'Control Flow',rel:1},
  ObjectFlow:{tr:'Object Flow',rel:1},
  Connector:{tr:'Connector',rel:1},
  Anchor:{tr:'Not Bağlantısı',rel:1}
};
const DT = {
  bdd:{tr:'Blok Tanım Diyagramı (BDD)',col:'#3d7bd9',shapes:['Block','Package','Actor','Comment'],rels:['Composition','Aggregation','Association','Generalization','Dependency','Anchor']},
  ibd:{tr:'İç Blok Diyagramı (IBD)',col:'#2e9e6a',shapes:['Part','Port','Value','Comment'],rels:['Connector','Dependency','Anchor']},
  uc:{tr:'Use Case Diyagramı',col:'#2e8fa3',shapes:['Actor','UseCase','Subject','Comment'],rels:['Association','Include','Extend','Generalization','Dependency','Anchor']},
  act:{tr:'Aktivite Diyagramı',col:'#7a4fbf',shapes:['Action','Initial','Final','FlowFinal','Decision','Merge','Fork','Join','Object','Partition','Comment'],rels:['ControlFlow','ObjectFlow','Dependency','Anchor']}
};
const OWN = {
  Model:['Package','Block','Actor','UseCase','Subject','Activity','Comment'],
  Package:['Package','Block','Actor','UseCase','Subject','Activity','Comment'],
  Block:['Part','Value','Port','Activity','Comment'],
  Part:['Port'],
  Subject:['UseCase'],
  UseCase:['Activity','Comment'],
  Activity:['Action','Object','Partition','Initial','Final','FlowFinal','Decision','Merge','Fork','Join','Comment']
};
const BASE = {Package:'Paket',Block:'Blok',Part:'part',Value:'değer',Port:'p',Actor:'Aktör',UseCase:'Use Case',Subject:'Sistem',Activity:'Aktivite',Action:'Aksiyon',Object:'nesne',Partition:'Kulvar'};
const RANK = ['Diagram','Package','Block','Subject','Actor','UseCase','Activity','Part','Value','Port','Partition','Action','Object','Initial','Decision','Merge','Fork','Join','Final','FlowFinal','Comment'];
const ELL = new Set(['UseCase','Initial','Final','FlowFinal']);
const DIA = new Set(['Decision','Merge']);
const CONT = new Set(['Partition','Subject','Package']);
const UNNAMED = new Set(['Initial','Final','FlowFinal','Fork','Join','Decision','Merge']);
const ER = {
  Association:{}, Composition:{src:'fd'}, Aggregation:{src:'hd'}, Generalization:{tgt:'tri'},
  Dependency:{dash:1,tgt:'open'}, Include:{dash:1,tgt:'open',st:'«include»'}, Extend:{dash:1,tgt:'open',st:'«extend»'},
  ControlFlow:{tgt:'open'}, ObjectFlow:{tgt:'open'}, Connector:{}, Anchor:{dash:2}
};
const FILL = {Block:'#fff8d8',Part:'#fff8d8',Value:'#f3eeff',Action:'#fff8d8',UseCase:'#fff8d8',Comment:'#fffde9',Subject:'#ffffff',Partition:'#ffffff',Object:'#ffffff',Package:'#f6eed6',Port:'#ffffff',Actor:'none'};

/* ================= ICON LIBRARY ================= */
const ICON_CATS = [
  ['auto', 'Otomotiv', '#c0392b'],
  ['aero', 'Havacılık ve Uzay', '#1f6fd1'],
  ['comp', 'Bilgisayar ve Elektronik', '#6c3fc4'],
  ['def', 'Savunma Sistemleri', '#5a6b24'],
  ['energy', 'Enerji ve Güç', '#d18a00'],
  ['sense', 'Sensör ve Haberleşme', '#0f8a8a'],
  ['mech', 'Mekanik ve Üretim', '#5d6d7e'],
  ['soft', 'Yazılım ve Veri', '#2e7d32'],
  ['org', 'İnsan ve Organizasyon', '#b04f86'],
  ['gen', 'Genel', '#37474f']
];
const ICON_CAT_COL = Object.fromEntries(ICON_CATS.map(c => [c[0], c[2]]));
const ICONS = {};
(function(){
  const f = n => +n.toFixed(2);
  const P = d => `<path d="${d}"/>`;
  const C = (x, y, r, fill) => `<circle cx="${x}" cy="${y}" r="${r}"${fill ? ' fill="currentColor"' : ''}/>`;
  const R = (x, y, w, h, r) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"${r ? ` rx="${r}"` : ''}/>`;
  const El = (cx, cy, rx, ry, rot) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}"${rot ? ` transform="rotate(${rot} ${cx} ${cy})"` : ''}/>`;
  const rot = (deg, inner, cx, cy) => `<g transform="rotate(${deg} ${cx == null ? 12 : cx} ${cy == null ? 12 : cy})">${inner}</g>`;
  const rep = (n, fn) => Array.from({length:n}, (_, i) => fn(i)).join('');
  const poly = pts => 'M' + pts.map(p => f(p[0]) + ' ' + f(p[1])).join(' L') + ' Z';
  const gear = (cx, cy, R1, R2, n) => {
    const pts = [];
    for(let i = 0; i < n; i++){
      const a = i / n * Math.PI * 2, s = Math.PI / n;
      [[a - s * 0.55, R2], [a - s * 0.3, R1], [a + s * 0.3, R1], [a + s * 0.55, R2]].forEach(([b, r]) => pts.push([cx + r * Math.cos(b), cy + r * Math.sin(b)]));
    }
    return P(poly(pts));
  };
  const star = (cx, cy, R1, R2, n, off) => { const pts = []; for(let i = 0; i < n * 2; i++){ const a = (off || -Math.PI / 2) + i * Math.PI / n, r = i % 2 ? R2 : R1; pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); } return P(poly(pts)); };
  const rays = (cx, cy, r1, r2, n) => P(Array.from({length:n}, (_, i) => { const a = i / n * Math.PI * 2; return `M${f(cx + r1 * Math.cos(a))} ${f(cy + r1 * Math.sin(a))}L${f(cx + r2 * Math.cos(a))} ${f(cy + r2 * Math.sin(a))}`; }).join(''));
  const person = (cx, cy, s) => C(cx, cy - 4 * s, 3 * s) + P(`M${f(cx - 6 * s)} ${f(cy + 7 * s)}a${f(6 * s)} ${f(6 * s)} 0 0 1 ${f(12 * s)} 0`);
  const D = (cat, id, name, svg) => { ICONS[id] = {id, cat, name, svg}; };

  /* ---- Otomotiv ---- */
  D('auto', 'car', 'Otomobil', P('M2.5 16v-3.2L5 8.5h8.5l3.6 4H20.5a1 1 0 0 1 1 1V16') + P('M9.2 16h5.6') + C(6.8, 16.5, 2.1) + C(17, 16.5, 2.1) + P('M6.2 12.5h10.5M11 8.5v4'));
  D('auto', 'truck', 'Kamyon', R(2, 6, 12, 10, 1) + P('M14 9.5h4l3 3.5v3h-7z') + C(6, 17.5, 1.8) + C(17, 17.5, 1.8));
  D('auto', 'bus', 'Otobüs', R(4, 3, 16, 15, 2.5) + P('M4 11h16M4 7h16') + C(8, 14.5, .9, 1) + C(16, 14.5, .9, 1) + P('M7 18v2.5M17 18v2.5'));
  D('auto', 'engine', 'Motor', P('M5 9h3V7h6v2h2.5l2 2.5V17H16l-2 2H8v-2.5H5z') + P('M2.5 11v5M2.5 13.5H5M21.5 11v5M19 13.5h2.5M9 4h4M11 4v3'));
  D('auto', 'wheel', 'Tekerlek', C(12, 12, 9.5) + C(12, 12, 6) + C(12, 12, 1.8) + rays(12, 12, 2.4, 6, 5));
  D('auto', 'steering', 'Direksiyon', C(12, 12, 9) + C(12, 12, 2.6) + P('M3.4 10.5h6.1M14.5 10.5h6.1M12 14.6v6.3'));

function diagramSVG(d, exp){
  const SM = new Map(d.shapes.map(s => [s.id, s]));
  const cont = [], norm = [], ports = [];
  d.shapes.forEach(sh => {
    const e = E(sh.el); if(!e) return;
    const str = drawShape(sh, e, d, SM, exp);
    (CONT.has(e.kind) ? cont : (e.kind === 'Port' && sh.parent ? ports : norm)).push(str);
  });
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const grow = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  d.shapes.forEach(sh => {
    const e = E(sh.el); if(!e) return;
    grow(sh.x, sh.y); grow(sh.x + sh.w, sh.y + sh.h);
    if(e.kind === 'Port'){ const L = tw(e.name + (e.type ? ' : ' + typeName(e.type) : ''), false, 11); grow(sh.x - L - 6, sh.y - 14); grow(sh.x + sh.w + L + 6, sh.y + sh.h + 14); }
    if(e.kind === 'Actor'){ grow(sh.x - 30, sh.y); grow(sh.x + sh.w + 30, sh.y + sh.h + 14); }
  });
  let edges = '';
  d.edges.forEach(ed => {
    const S = SM.get(ed.s), T2 = SM.get(ed.t); if(!S || !T2) return;
    if(ed.el && !E(ed.el)) return;
    const pts = edgeGeom(S, T2, ed); ed._pts = pts;
    pts.forEach(p => grow(p.x, p.y));
    edges += drawEdge(d, ed, SM, pts, exp);
  });
  let frame = '', bbox = null;
  if(isFinite(x0)){
    const owner = E(d.owner);
    const label = d.dtype + ' [' + (owner ? (KIND[owner.kind].en || owner.kind) : '') + '] ' + (owner ? owner.name : '') + ' [' + d.name + ']';
    const fx = x0 - 30, fy = y0 - 50, fw = (x1 - x0) + 60, fh = (y1 - y0) + 80;
    const L = tw(label, false, 12) + 16;
    const FW = Math.max(fw, L + 30);
    frame = `<g class="frame"><rect x="${fx}" y="${fy}" width="${FW}" height="${fh}" fill="none" stroke="#555" stroke-width="1"/>` +
      `<path d="M${fx},${fy + 22} H${fx + L} L${fx + L + 10},${fy + 12} V${fy}" fill="none" stroke="#555" stroke-width="1"/>` +
      T(label, fx + 7, fy + 15, {anchor:'start', size:12}) + '</g>';
    bbox = {x:fx, y:fy, w:FW, h:fh};
  }
  return {svg:frame + cont.join('') + norm.join('') + ports.join('') + edges, bbox};
}

wrapEl.addEventListener('wheel', ev => {

function zoomAt(d, nz, mx, my){

function inlineEdit(sx, sy, w, h, val, multi, cb){

  inl.style.textAlign = multi ? 'left' : 'center';

function exportSVGString(){
  const d = cur(); if(!d) return null;
  const {svg, bbox} = diagramSVG(d, true);
  if(!bbox){ toast('Diyagram boş'); return null; }
  const pad = 12, x = bbox.x - pad, y = bbox.y - pad, w = Math.ceil(bbox.w + pad * 2), h = Math.ceil(bbox.h + pad * 2);
  return {str:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="${x} ${y} ${w} ${h}"><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#ffffff"/>${svg}</svg>`, w, h, name:fileSafe(d.name)};
}
function fileSafe(s){ return String(s || 'diyagram').replace(/[\\/:*?"<>|]+/g, '_').trim() || 'diyagram'; }
function download(blob, name){
  if(NATIVE){
    const ext = (name.split('.').pop() || '').toLowerCase();
    const flt = {png:'PNG görüntü (*.png)|*.png', svg:'SVG görüntü (*.svg)|*.svg', html:'HTML (*.html)|*.html', json:'JSON (*.json)|*.json'}[ext] || 'Tüm dosyalar (*.*)|*.*';
    const rd = new FileReader();
    rd.onload = async () => {
      const b64 = String(rd.result).split(',')[1] || '';
      const r = await nDialog('save', name, flt, b64, true);
      if(r.error) toast('Kaydedilemedi: ' + r.error); else if(r.path) toast('Kaydedildi: ' + r.path);
    };
    rd.readAsDataURL(blob); return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
function exportSVG(){ const r = exportSVGString(); if(r) download(new Blob([r.str], {type:'image/svg+xml'}), r.name + '.svg'); }
function toPNG(cb){
  const r = exportSVGString(); if(!r) return;
  const scale = Math.min(3, Math.max(1, 6000 / Math.max(r.w, r.h) < 2 ? 1 : 2));
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = Math.round(r.w * scale); c.height = Math.round(r.h * scale);
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => cb(b, r.name), 'image/png');
  };
  img.onerror = () => toast('Görüntü oluşturulamadı');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(r.str);
}
function exportPNG(){ toPNG((b, n) => download(b, n + '.png')); }
function copyImage(){
  toPNG(async b => {
    try { await navigator.clipboard.write([new ClipboardItem({'image/png': b})]); toast('Diyagram panoya kopyalandı — Word/PowerPoint\'e yapıştırabilirsiniz'); }
    catch(e){ toast('Panoya kopyalama bu tarayıcıda izinli değil; PNG indirin.'); }
  });
}

async function saveJSON(saveAs){

function loadModel(m){

function parseModelText(txt){

  try {
    if(/^\s*</.test(txt)){ const mm = txt.match(/<script type="application\/json" id="embedded-model">([\s\S]*?)<\/script>/); if(mm && mm[1].trim()) m = JSON.parse(mm[1]); }
    else m = JSON.parse(txt.replace(/^\uFEFF/, ''));

document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const k = ev.key, c = ev.ctrlKey || ev.metaKey;
  if(k === ' '){ ST.space = true; ev.preventDefault(); return; }
  if(ev.altKey && k === 'ArrowLeft'){ ev.preventDefault(); navBack(); return; }
  if(ev.altKey && k === 'ArrowRight'){ ev.preventDefault(); navFwd(); return; }
  if(c && (k === 'z' || k === 'Z') && !ev.shiftKey){ ev.preventDefault(); undo(); return; }
  if(c && (k === 'y' || k === 'Y' || ((k === 'z' || k === 'Z') && ev.shiftKey))){ ev.preventDefault(); redo(); return; }
  if(c && (k === 's' || k === 'S')){ ev.preventDefault(); saveJSON(ev.shiftKey); return; }
  if(c && ev.shiftKey && (k === 'l' || k === 'L')){ ev.preventDefault(); const d0 = cur(); if(d0) runLayout(LAYOUTS[d0.dtype][0][0]); return; }
  if(c && (k === 'o' || k === 'O')){ ev.preventDefault(); openFile(); return; }
  if(k === 'Escape'){ if($('#modal').style.display === 'flex'){ $('#modal').style.display = 'none'; return; } setTool(null); ST.sel.clear(); hideMenu(); renderDiagram(); renderProps(); return; }
  const d = cur();
  if(ST.focus === 'tree'){
    if(k === 'Delete' && ST.tsel && ST.tsel !== M.rootId){ snap(); delModel([ST.tsel]); afterChange(); }
    if(k === 'F2' && ST.tsel){ ev.preventDefault(); treeRename(ST.tsel); }
    if(k === 'Enter' && ST.tsel && E(ST.tsel) && E(ST.tsel).kind === 'Diagram') openD(ST.tsel);
    return;
  }
  if(!d) return;
  if(c && (k === 'a' || k === 'A')){ ev.preventDefault(); ST.sel = new Set(d.shapes.map(s => s.id)); renderDiagram(); renderProps(); return; }
  if(k === 'Delete'){
    if(!ST.sel.size) return; ev.preventDefault();
    if(ev.shiftKey){ snap(); removeFromDiagram(d, [...ST.sel]); afterChange(); } else delSelectedModel();
    return;
  }
  if(k === 'F2'){ ev.preventDefault(); const id = [...ST.sel][0]; const sh = id && shapeOf(d, id); if(sh) editShape(sh); else { const ed = d.edges.find(x => x.id === id); if(ed) editEdge(ed, 'name'); } return; }
  if(k.startsWith('Arrow') && ST.sel.size){
    ev.preventDefault();
    const st = ev.shiftKey ? 1 : G, dx = k === 'ArrowLeft' ? -st : k === 'ArrowRight' ? st : 0, dy = k === 'ArrowUp' ? -st : k === 'ArrowDown' ? st : 0;
    snap();
    const set = new Set([...ST.sel]); d.shapes.forEach(s => { if(s.parent && set.has(s.parent)) set.add(s.id); });
    d.shapes.forEach(s => { if(set.has(s.id) && !(s.parent && !ST.sel.has(s.parent) && ST.sel.has(s.id))){ s.x += dx; s.y += dy; } });
    renderDiagram(); persistSoon(); return;
  }
  if(k === '+' || k === '='){ zoomBtn(1.2); } if(k === '-'){ zoomBtn(1 / 1.2); }
});

/* splitters */
(function(){
  const vs = $('#vsplit'), hs = $('#hsplit'), left = $('#left'), tb = $('#treeBox'), pb = $('#propsBox');
  vs.addEventListener('mousedown', ev => {
    ev.preventDefault(); const sx = ev.clientX, w0 = left.offsetWidth;
    const mv = e => { left.style.width = Math.max(180, Math.min(600, w0 + e.clientX - sx)) + 'px'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
  hs.addEventListener('mousedown', ev => {
    ev.preventDefault(); const sy = ev.clientY, h0 = tb.offsetHeight, tot = tb.offsetHeight + pb.offsetHeight;
    const mv = e => { const h = Math.max(60, Math.min(tot - 60, h0 + e.clientY - sy)); tb.style.flex = 'none'; tb.style.height = h + 'px'; pb.style.flex = '1'; };
    const up = () => { removeEventListener('mousemove', mv); removeEventListener('mouseup', up); };
    addEventListener('mousemove', mv); addEventListener('mouseup', up);
  });
})();

/* ================= BOOT ================= */
(async function boot(){
  if(NATIVE){
    document.querySelectorAll('.nat').forEach(b => b.style.display = 'inline-block');
    let info = {};
    try { info = await window.nativeInfo() || {}; } catch(e){}
    let m = null;
    if(info.argText) m = parseModelText(info.argText);
    if(m){ curPath = /\.(sysml|json)$/i.test(info.argPath || '') ? info.argPath : ''; dirty = !curPath; }
    else if(info.autosave){ m = parseModelText(info.autosave); if(m){ curPath = info.lastPath || ''; dirty = !!info.dirty || !curPath; } }
    if(!m){ m = demo(); dirty = true; }
    loadModel(m); renderAll(); updTitle(); persist();
    return;
  }
  let emb = null, ls = null;
  try { const t = $('#embedded-model').textContent.trim(); if(t) emb = JSON.parse(t); } catch(e){}
  try { const t = localStorage.getItem(LSK); if(t) ls = JSON.parse(t); } catch(e){}
  let m;
  if(validModel(emb) && validModel(ls) && ls.uid === emb.uid && (ls.savedAt || 0) > (emb.savedAt || 0)) m = ls;
  else if(validModel(emb)) m = emb;
  else if(validModel(ls)) m = ls;
  else m = demo();
  loadModel(m);
  renderAll(); persist();
})();
</script>
